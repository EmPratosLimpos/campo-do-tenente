name: Sondagem manual de temas (D-047)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sondar:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: desenvolvimento
          fetch-depth: 1

      - name: Configurar Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.11'

      - name: Sondar os tres modelos nas ultimas 7 materias revisadas
        env:
          OPENCODE_ZEN_API_KEY: ${{ secrets.OPENCODE_ZEN_API_KEY }}
        run: |
          set -o pipefail
          python scripts/classificar_temas.py --sondagem 2>&1 | tee "$RUNNER_TEMP/sondagem.log"
