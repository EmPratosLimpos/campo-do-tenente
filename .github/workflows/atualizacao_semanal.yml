name: Atualizacao semanal dos dados

on:
  schedule:
    # Quarta-feira as 03:00 no horario de Brasilia (UTC-3, sem horario de verao).
    # 03:00 em Brasilia equivale a 06:00 UTC.
    - cron: '0 6 * * 3'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: atualizacao-semanal
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout da main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: pip install -r coletor/requirements.txt

      - name: Atualizar a semana
        id: atualizar
        run: |
          set -o pipefail
          python scripts/atualizar_semana.py 2>&1 | tee atualizacao.log

      - name: Ver se houve dado novo
        id: mudanca
        run: |
          git status --porcelain > mudanca.txt || true
          cat mudanca.txt
          if [[ -s mudanca.txt ]]; then
            echo "houve=true" >> "$GITHUB_OUTPUT"
          else
            echo "houve=false" >> "$GITHUB_OUTPUT"
            echo "Nada mudou. Sem commit."
          fi

      - name: Conferir que so dados mudaram
        if: steps.mudanca.outputs.houve == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git status --porcelain | awk '{print $2}' > alterados.txt || true
          cat alterados.txt
          if ! python scripts/so_dados_mudaram.py $(cat alterados.txt); then
            data_br=$(TZ=America/Sao_Paulo date +%d/%m/%Y)
            gh issue create \
              --title "Atualizacao de dados com alteracao de codigo em ${data_br}" \
              --body "A atualizacao encontrou arquivos de codigo alterados e nao publicou. Veja alterados.txt no log da execucao."
            exit 1
          fi

      - name: Sanidade final
        if: steps.mudanca.outputs.houve == 'true'
        run: |
          set -o pipefail
          python coletor/testes_sanidade.py 2>&1 | tee sanidade.log
          python -m unittest discover -s tests 2>&1 | tee testes.log
          python scripts/verificar_regras.py 2>&1 | tee regras.log

      - name: Commit na main so com dados
        if: steps.mudanca.outputs.houve == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- dados config_cidade.json CHANGELOG.md
          dados_txt=$(python - << 'PY'
          import json
          from pathlib import Path
          melhor = None
          for caminho in Path("dados/brutos").glob("contagem_votacoes_ordinarias_*.json"):
              try:
                  dados = json.loads(caminho.read_text(encoding="utf-8"))
              except (OSError, ValueError):
                  continue
              for sessao in dados.get("sessoes") or []:
                  numero = sessao.get("numero")
                  data = sessao.get("data") or ""
                  if numero is None or not data:
                      continue
                  chave = (str(data), int(numero))
                  if melhor is None or chave > melhor[0]:
                      melhor = (chave, int(numero), str(data))
          if melhor is None:
              raise SystemExit("Sem sessao ordinaria no consolidado.")
          _, numero, data = melhor
          ano, mes, dia = data[:10].split("-")
          print(f"{numero}|{dia}/{mes}/{ano}")
          PY
          )
          numero=$(echo "$dados_txt" | cut -d'|' -f1)
          data_br=$(echo "$dados_txt" | cut -d'|' -f2)
          git commit -m "Atualiza dados ate a sessao ordinaria ${numero} de ${data_br}"
          git push origin main

      - name: Levar para desenvolvimento sem force
        if: steps.mudanca.outputs.houve == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git fetch origin desenvolvimento:refs/remotes/origin/desenvolvimento || true
          git checkout desenvolvimento
          if ! git merge --no-ff origin/main -m "Atualiza desenvolvimento com dados da main"; then
            data_br=$(TZ=America/Sao_Paulo date +%d/%m/%Y)
            git merge --abort || true
            gh issue create \
              --title "Atualizacao de dados falhou em ${data_br}" \
              --body "Conflito ao levar a main para desenvolvimento. Nenhum force foi usado."
            exit 1
          fi
          git push origin desenvolvimento

      - name: Registrar falha com issue
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          data_br=$(TZ=America/Sao_Paulo date +%d/%m/%Y)
          trecho=$(tail -n 80 atualizacao.log sanidade.log testes.log regras.log 2>/dev/null | head -n 120 || echo "Sem trecho de log.")
          gh issue create \
            --title "Atualizacao de dados falhou em ${data_br}" \
            --body "A atualizacao semanal falhou e nada foi publicado. Trecho do erro: ${trecho}"
          echo "::error::A atualizacao semanal falhou. Nada foi publicado."
