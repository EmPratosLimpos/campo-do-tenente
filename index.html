    /* Tipografia: uma família só, três pesos */

  * { box-sizing: border-box; }
  [hidden] { display: none !important; }

  .topo-marca-linha {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    min-height: 44px;
  }
  .site-logo {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    text-decoration: none;
    color: var(--texto);
    min-height: 44px;
    min-width: 0;
    flex: 1;
  }
  .site-logo span { font-weight: 400; font-size: 17px; letter-spacing: -0.01em; }
  .site-logo b { font-weight: 800; font-size: 17px; letter-spacing: -0.01em; }
  .topo-icones { display: flex; gap: 4px; flex-shrink: 0; }
  .btn-icone-topo {
    width: 44px;
    height: 44px;
    min-width: 44px;
    min-height: 44px;
    border: none;
    border-radius: 14px;
    background: transparent;
    color: var(--texto);
    display: inline-flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    padding: 0;
  }
  .btn-icone-topo:hover { background: var(--superficie-2); }
  .topo-tagline {
    margin: 0 0 8px;
    font-size: var(--t-apoio);
    color: var(--texto-suave);
    line-height: 1.4;
  }
  .menu-lateral-logo { margin-bottom: 4px; }
  .menu-lateral-tagline {
    font-size: var(--t-apoio);
    color: var(--texto-suave);
    margin: 0 0 12px;
    line-height: 1.4;
  }


  body {
    margin: 0;
    background: var(--fundo);
    color: var(--texto);
    font-family: var(--fonte);
    font-size: 15px;
    line-height: 1.45;
    -webkit-font-smoothing: antialiased;
  }

  a { color: var(--link); }
  a:focus-visible, button:focus-visible, select:focus-visible, input:focus-visible, summary:focus-visible {
    outline: 3px solid var(--foco);
    outline-offset: 2px;
  }

  .pular-conteudo {
    position: absolute;
    left: 12px;
    top: 8px;
    z-index: 3000;
    width: 1px;
    height: 1px;
    padding: 0;
    overflow: hidden;
    clip: rect(0, 0, 0, 0);
    white-space: nowrap;
    border: 0;
    background: var(--marca-solida);
    color: var(--sobre-marca);
    font-family: var(--fonte);
    font-size: 14px;
    font-weight: 800;
    text-decoration: none;
    border-radius: 8px;
  }
  .pular-conteudo:focus,
  .pular-conteudo:focus-visible {
    width: auto;
    height: auto;
    clip: auto;
    overflow: visible;
    padding: 10px 14px;
    min-height: 44px;
    min-width: 44px;
    outline: 3px solid var(--foco);
    outline-offset: 2px;
  }

  .pagina {
    max-width: 390px;
    margin: 0 auto;
    min-height: 100vh;
    background: var(--fundo);
  }

  .topo-fixo {
    position: sticky;
    top: 0;
    z-index: 20;
    background: var(--fundo);
    padding: 12px 16px 10px;
    overflow-anchor: none;
  }

  @media (max-width: 899.98px) {
    .topo-fixo .sub-camara.ativo,
    .topo-fixo .sub-vereadores.ativo {
      padding-top: var(--esp-3);
    }
    #painel-prefeito.ativo > .titulo-prefeito {
      margin-top: var(--esp-3);
    }
    .topo-fixo.compacto {
      padding: 8px 96px 8px 16px;
    }

    .topo-fixo.compacto .topo-tagline,
    .topo-fixo.compacto .topo-marca-linha .site-logo,
    .topo-fixo.compacto .sub-camara,
    .topo-fixo.compacto .titulo-vereadores,
    .topo-fixo.compacto .nav-vereador,
    .topo-fixo.compacto #apoio-vereador,
    .topo-fixo.compacto #notas-vereador-wrap {
      display: none;
    }

    .topo-fixo.compacto .sub-vereadores {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 0;
    }

    .topo-fixo.compacto #seletor-vereador-wrap {
      flex: 1;
      min-width: 0;
    }

    .topo-fixo.compacto .seletor-vereador {
      position: relative;
    }

    .topo-fixo.compacto .sessao-titulo-linha {
      order: 2;
      margin-bottom: 0;
      flex-shrink: 0;
    }

    .topo-fixo.compacto .sel-vereador-face {
      min-height: 44px;
      padding: 6px 10px;
      gap: 8px;
    }
    .topo-fixo.compacto .sel-vereador-face .perfil-foto-wrap,
    .topo-fixo.compacto .sel-vereador-face .perfil-foto,
    .topo-fixo.compacto .sel-vereador-face .perfil-iniciais {
      display: none;
    }
    .topo-fixo.compacto .sel-vereador-face .nm {
      font-size: 15px;
    }
    .topo-fixo.compacto .sel-vereador-face .pt {
      display: none;
    }
    .topo-fixo.compacto .seletor-vereador label {
      position: absolute;
      width: 1px;
      height: 1px;
      margin: -1px;
      padding: 0;
      border: 0;
      overflow: hidden;
      clip: rect(0 0 0 0);
      white-space: nowrap;
    }

    .topo-fixo.compacto .topo-marca-linha {
      min-height: 0;
      height: 0;
      margin: 0;
      padding: 0;
      overflow: visible;
    }

    .topo-fixo.compacto .topo-icones {
      position: fixed;
      top: 8px;
      right: 12px;
      z-index: 25;
    }
  }

  .titulo-acoes-direita {
    display: flex;
    align-items: center;
    gap: 0;
    flex-shrink: 0;
  }

  .sessao-titulo-linha {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    margin-bottom: 2px;
  }

  .sessao-titulo-linha .sessao-titulo,
  .sessao-titulo-linha .titulo-vereadores {
    margin: 0;
  }

  .sub-vereadores .sessao-titulo-linha {
    margin-bottom: 6px;
  }

  .topo-local {
    font-size: 13px;
    font-weight: 600;
    color: var(--neutro);
    letter-spacing: 0.04em;
  }

  .cabecalho-bloco {
    display: flex;
    flex-direction: column;
    gap: 6px;

    padding-right: 48px;
  }

  .titulo-site {
    font-family: var(--fonte);
    font-weight: 800;
    font-size: 34px;
    line-height: 1.05;
    margin: 0;
    letter-spacing: -0.035em;
    color: var(--texto);
  }

  .selo-sapl {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: var(--superficie);
    border: 1px solid var(--linha);
    padding: 4px 10px;
    border-radius: 20px;
    font-size: 13px;
    font-weight: 600;
    color: var(--texto-suave);
    width: fit-content;
    box-shadow: 0 1px 2px rgba(0, 0, 0, 0.03);
  }

  .ponto-status {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--app-verde, #34c759);
    flex-shrink: 0;
  }

  .subtitulo-site {
    font-family: var(--fonte);
    font-weight: 400;
    font-size: 13.5px;
    line-height: 1.4;
    margin: 0;
    color: var(--texto-suave);
    max-width: 100%;
  }

  .alternar-tema {
    position: static;
    top: auto;
    right: auto;
    z-index: auto;
    width: 44px;
    height: 44px;
    min-width: 44px;
    min-height: 44px;
    padding: 0;
    border: none;
    background: transparent;
    border-radius: 14px;
    color: var(--texto);
    display: inline-flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    box-shadow: none;
  }
  .alternar-tema:hover { background: var(--superficie-2); }

  .share-sheet-backdrop {
    position: fixed;
    inset: 0;
    z-index: 1000;
    display: flex;
    align-items: flex-end;
    justify-content: center;
    background: rgba(0, 0, 0, 0.45);
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
    transition: opacity 0.2s ease, visibility 0.2s ease;
  }

  .share-sheet-backdrop.ativo {
    opacity: 1;
    visibility: visible;
    pointer-events: auto;
  }

  .share-sheet {
    width: 100%;
    max-width: 520px;
    max-height: 92vh;
    max-height: 92dvh;
    min-height: 0;
    background: var(--superficie);
    border-radius: 24px 24px 0 0;
    box-shadow: 0 -10px 40px rgba(0, 0, 0, 0.2);
    transform: translateY(100%);

  /* Em Pratos Limpos · folha de impressão (PDF)
     Ao tocar em "Folha em PDF", o site preenche #folha-impressao com o resumo
     do contexto aberto (sessão, matéria ou vereador) e chama window.print().
     Fora da impressão a folha fica escondida. Na impressão, só ela aparece. */
  #folha-impressao { display: none; }

  @media print {
    @page { size: A4; margin: 16mm 16mm 18mm; }
    body > *:not(#folha-impressao) { display: none !important; }
    #folha-impressao { display: block; font-family: var(--fonte); color: #13201A; font-size: 10.5pt; line-height: 1.5; }
    #folha-impressao * { box-sizing: border-box; margin: 0; }
    .fi-topo { display: flex; justify-content: space-between; align-items: center; padding-bottom: 5mm; border-bottom: 1.5pt solid #1E7A4C; }
    .fi-marca { display: flex; align-items: center; gap: 8px; font-size: 14pt; }
    .fi-marca b { font-weight: 800; }
    .fi-ind { font-size: 9pt; color: #4A5A51; text-align: right; }
    .fi-frase { font-size: 20pt; font-weight: 800; line-height: 1.2; margin: 7mm 0 1.5mm; }
    .fi-periodo { color: #4A5A51; font-size: 10pt; }
    .fi-nums { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4mm; margin: 6mm 0 8mm; }
    .fi-num { border: 1pt solid #D3DED6; border-radius: 4mm; padding: 4mm; }
    .fi-num b { display: block; font-size: 22pt; font-weight: 800; line-height: 1; }
    .fi-num b small { font-size: 11pt; font-weight: 600; color: #4A5A51; }
    .fi-num span { font-size: 9.5pt; color: #4A5A51; font-weight: 600; }
    .fi-h2 { font-size: 12pt; font-weight: 800; margin-bottom: 3mm; }
    .fi-mat { padding: 4mm 0; border-top: .75pt solid #D3DED6; break-inside: avoid; }
    .fi-tags { display: flex; gap: 2mm; flex-wrap: wrap; margin-bottom: 2mm; }
    /* Na impressão as tags são só contorno: funciona em impressora preto e branco */
    .fi-tag { font-size: 8.5pt; font-weight: 600; border: .75pt solid #7C8C82; border-radius: 99px; padding: .6mm 2.6mm; display: inline-flex; align-items: center; gap: 1.5mm; }
    .fi-tag i { width: 2.4mm; height: 2.4mm; border-radius: .6mm; display: block; }
    .fi-tag.fi-aprovado { border-color: #2F5BEA; color: #2F5BEA; }
    .fi-tag.fi-rejeitado { border-color: #C2410C; color: #C2410C; }
    .fi-mat h3 { font-size: 11.5pt; font-weight: 800; margin-bottom: 1mm; }
    .fi-meta { font-size: 9pt; color: #4A5A51; margin-top: 1mm; }
    .fi-rodape { position: fixed; bottom: 0; left: 0; right: 0; display: flex; justify-content: space-between; align-items: flex-end; gap: 6mm; font-size: 8.5pt; color: #4A5A51; border-top: .75pt solid #D3DED6; padding-top: 3mm; }
    .fi-rodape b { color: #13201A; }
    .fi-qr { width: 24mm; height: 24mm; }
  }

    .share-sheet-backdrop,

<script>
/*
  Em Pratos Limpos · gerador de cartões para compartilhar
  Desenha os cartões aprovados (sessão, matéria e vereador) em <canvas>,
  nos formatos feed (1080 × 1350) e stories (1080 × 1920).
  Não usa biblioteca nem serviço externo: respeita a CSP do site.

  Uso:
    const canvas = await CartoesEPL.desenhar("sessao", "feed", dados);
    const blob = await CartoesEPL.paraBlob(canvas);   // image/png

  Formato dos dados: ver CartoesEPL.EXEMPLOS no fim do arquivo.
*/
(function (global) {
  "use strict";

  var COR = {
    marca: "#1E7A4C", branco: "#FFFFFF", texto: "#13201A", apoio: "#4A5A51",
    painelSec: "#EFF4F0", tag: "#E4ECE6", linha: "#E4ECE6", trilha: "#DDE5DF",
    sim: "#2F5BEA", nao: "#C2410C", abst: "#5B6573", presente: "#1E7A4C"
  };
  var FONTE = '"Plus Jakarta Sans", system-ui, sans-serif';
  var FORMATOS = {
    feed:  { w: 1080, h: 1350, pt: 72,  pl: 72, pb: 64,  frase: [76, 56], painelPad: 44 },
    story: { w: 1080, h: 1920, pt: 230, pl: 80, pb: 250, frase: [92, 52], painelPad: 40 }
  };

  /* ---------- utilitários de desenho ---------- */
  function f(peso, tam) { return peso + " " + tam + "px " + FONTE; }
  function rr(ctx, x, y, w, h, r) {
    r = Math.min(r, h / 2, w / 2);
    ctx.beginPath();
    ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
  }
  function quebra(ctx, texto, larg) {
    var palavras = String(texto).split(/\s+/), linhas = [], atual = "";
    palavras.forEach(function (p) {
      var teste = atual ? atual + " " + p : p;
      if (ctx.measureText(teste).width > larg && atual) { linhas.push(atual); atual = p; } else atual = teste;
    });
    if (atual) linhas.push(atual);
    return linhas;
  }
  function listra(ctx, x, y, w, h, cor, passo) {
    ctx.save(); rr(ctx, x, y, w, h, Math.min(6, h / 2)); ctx.clip();
    ctx.strokeStyle = cor; ctx.lineWidth = passo * 0.55;
    for (var i = -h; i < w + h; i += passo) { ctx.beginPath(); ctx.moveTo(x + i, y + h); ctx.lineTo(x + i + h, y); ctx.stroke(); }
    ctx.restore();
  }
  // marcadores de legenda: "sim" (cheio), "nao" (anel), "abst" (traço), "tram" (tracejado), "listra" (falta sem justificativa)
  function marcador(ctx, tipo, x, y, d, cor) {
    var r = d / 2;
    ctx.save();
    if (tipo === "cheio") { ctx.fillStyle = cor; ctx.beginPath(); ctx.arc(x + r, y + r, r, 0, 7); ctx.fill(); }
    else if (tipo === "anel") { ctx.strokeStyle = cor; ctx.lineWidth = d * 0.18; ctx.beginPath(); ctx.arc(x + r, y + r, r - d * 0.09, 0, 7); ctx.stroke(); }
    else if (tipo === "traco") { ctx.fillStyle = cor; rr(ctx, x, y + r - d * 0.18, d, d * 0.36, d * 0.18); ctx.fill(); }
    else if (tipo === "tracejado") { ctx.strokeStyle = cor; ctx.lineWidth = d * 0.14; ctx.setLineDash([d * 0.22, d * 0.18]); ctx.beginPath(); ctx.arc(x + r, y + r, r - d * 0.07, 0, 7); ctx.stroke(); }
    else if (tipo === "listra") { listra(ctx, x, y, d, d, cor, d * 0.42); }
    else if (tipo === "quadrado") { ctx.fillStyle = cor; rr(ctx, x, y, d, d, d * 0.28); ctx.fill(); }
    ctx.restore();
  }
  function logo(ctx, x, y, d, cor) {
    var k = d / 64, cx = x + 32 * k, cy = y + 32 * k;
    ctx.save();
    ctx.globalAlpha = 0.4; ctx.strokeStyle = cor; ctx.lineWidth = 4 * k;
    ctx.beginPath(); ctx.arc(cx, cy, 21 * k, 0, 7); ctx.stroke();
    ctx.globalAlpha = 1; ctx.lineWidth = 7 * k; ctx.lineCap = "round";
    ctx.beginPath(); ctx.arc(cx, cy, 21 * k, -Math.PI / 2, -Math.PI / 2 + (285 / 180) * Math.PI); ctx.stroke();
    ctx.fillStyle = cor; ctx.beginPath(); ctx.arc(cx, cy, 9 * k, 0, 7); ctx.fill();
    ctx.restore();
  }
  function pilula(ctx, x, y, texto, o) {
    o = o || {};
    var tam = o.tam || 28, padX = o.padX || 24, h = tam + 24;
    ctx.font = f(600, tam);
    var marc = o.marcador ? tam * 0.72 : 0, gap = o.marcador ? 12 : 0;
    var w = ctx.measureText(texto).width + padX * 2 + marc + gap;
    if (o.medir) return { w: w, h: h };
    ctx.fillStyle = o.fundo || COR.tag; rr(ctx, x, y, w, h, h / 2); ctx.fill();
    if (o.marcador) marcador(ctx, o.marcador, x + padX, y + (h - marc) / 2, marc, o.corMarcador);
    ctx.fillStyle = o.cor || COR.texto; ctx.textBaseline = "middle";
    ctx.fillText(texto, x + padX + marc + gap, y + h / 2 + 1);
    ctx.textBaseline = "alphabetic";
    return { w: w, h: h };
  }

  /* ---------- blocos do painel branco ----------
     Cada bloco tem altura(ctx, larg) e desenhar(ctx, x, y, larg). */
  var B = {
    nums: function (itens) { // até 3 quadros: {valor, de, rotulo, marcador, cor}
      var gap = 20, alt = 0, col = Math.max(2, Math.min(3, itens.length));
      return {
        altura: function (ctx, L) {
          var w = (L - gap * (col - 1)) / col; ctx.font = f(600, 26);
          var maxL = 1; itens.forEach(function (it) { maxL = Math.max(maxL, quebra(ctx, it.rotulo, w - 48 - (it.marcador ? 32 : 0)).length); });
          alt = 26 + 84 + 10 + maxL * 32 + 24; return alt;
        },
        desenhar: function (ctx, x, y, L) {
          var w = (L - gap * (col - 1)) / col;
          itens.forEach(function (it, i) {
            var xx = x + i * (w + gap);
            ctx.fillStyle = COR.painelSec; rr(ctx, xx, y, w, alt, 32); ctx.fill();
            ctx.fillStyle = COR.texto; ctx.font = f(800, 84); ctx.fillText(String(it.valor), xx + 24, y + 26 + 70);
            if (it.de != null) { var vw = ctx.measureText(String(it.valor)).width; ctx.font = f(600, 36); ctx.fillStyle = COR.apoio; ctx.fillText(" de " + it.de, xx + 24 + vw, y + 26 + 70); }
            ctx.font = f(600, 26); ctx.fillStyle = COR.apoio;
            var off = it.marcador ? 32 : 0;
            if (it.marcador) marcador(ctx, it.marcador, xx + 24, y + 26 + 84 + 10 + 6, 22, it.cor);
            quebra(ctx, it.rotulo, w - 48 - off).forEach(function (l, k) { ctx.fillText(l, xx + 24 + off, y + 26 + 84 + 10 + 24 + k * 32); });
          });
        }
      };
    },
    barra: function (segs) { // {fração, cor, tipo:"cheio"|"tracejado"|"listra"}
      return {
        altura: function () { return 28; },
        desenhar: function (ctx, x, y, L) {
          ctx.fillStyle = COR.trilha; rr(ctx, x, y, L, 28, 14); ctx.fill();
          var cx = x;
          segs.forEach(function (s) {
            var w = Math.max(0, L * s.fracao - 4); if (w <= 0) return;
            if (s.tipo === "listra") listra(ctx, cx, y, w, 28, s.cor, 11);
            else if (s.tipo === "tracejado") { ctx.save(); ctx.strokeStyle = s.cor; ctx.lineWidth = 3; ctx.setLineDash([8, 6]); rr(ctx, cx + 1.5, y + 1.5, w - 3, 25, 12.5); ctx.fillStyle = COR.branco; ctx.fill(); ctx.stroke(); ctx.restore(); }
            else { ctx.fillStyle = s.cor; rr(ctx, cx, y, w, 28, 14); ctx.fill(); }
            cx += w + 6;
          });
        }
      };
    },
    sub: function (texto) {
      return { altura: function () { return 34; },
        desenhar: function (ctx, x, y) { ctx.font = f(800, 28); ctx.fillStyle = COR.apoio; ctx.fillText(texto, x, y + 26); } };
    },
    tags: function (tags) { // {texto, corQuadrado?, fundo?, cor?, marcador?}
      var linhas = [];
      function arranjo(ctx, L) {
        linhas = [[]]; var w = 0;
        tags.forEach(function (t) {
          var m = pilula(ctx, 0, 0, t.texto, { medir: true, marcador: t.corQuadrado ? "quadrado" : t.marcador });
          if (w + m.w > L && linhas[linhas.length - 1].length) { linhas.push([]); w = 0; }
          linhas[linhas.length - 1].push([t, m]); w += m.w + 14;
        });
      }
      return {
        altura: function (ctx, L) { arranjo(ctx, L); return linhas.length * 52 + (linhas.length - 1) * 14; },
        desenhar: function (ctx, x, y) {
          linhas.forEach(function (lin, i) {
            var cx = x;
            lin.forEach(function (par) {
              var t = par[0];
              pilula(ctx, cx, y + i * 66, t.texto, { fundo: t.fundo, cor: t.cor, marcador: t.corQuadrado ? "quadrado" : t.marcador, corMarcador: t.corQuadrado || t.corMarcador });
              cx += par[1].w + 14;
            });
          });
        }
      };
    },
    texto: function (texto, o) {
      o = o || {}; var tam = o.tam || 30, peso = o.peso || 400, lh = Math.round(tam * (o.lh || 1.4)), ls = [];
      return {
        altura: function (ctx, L) { ctx.font = f(peso, tam); ls = quebra(ctx, texto, L); if (o.maxLinhas && ls.length > o.maxLinhas) { ls = ls.slice(0, o.maxLinhas); ls[ls.length - 1] = ls[ls.length - 1].replace(/\s*\S*$/, "…"); } return ls.length * lh - (lh - tam) * 0.6; },
        desenhar: function (ctx, x, y) { ctx.font = f(peso, tam); ctx.fillStyle = o.cor || COR.texto; ls.forEach(function (l, i) { ctx.fillText(l, x, y + tam * 0.9 + i * lh); }); }
      };
    },
    linhas: function (itens) { // {rotulo, valor, de?, marcador?, cor?}
      var h = 64;
      return {
        altura: function () { return itens.length * h; },
        desenhar: function (ctx, x, y, L) {
          itens.forEach(function (it, i) {
            var yy = y + i * h;
            if (i) { ctx.fillStyle = COR.linha; ctx.fillRect(x, yy, L, 2); }
            var off = 0;
            if (it.marcador) { marcador(ctx, it.marcador, x, yy + h / 2 - 11, 22, it.cor); off = 36; }
            ctx.font = f(600, 30); ctx.fillStyle = COR.texto; ctx.fillText(it.rotulo, x + off, yy + h / 2 + 10);
            ctx.textAlign = "right";
            if (it.de != null) { ctx.font = f(600, 26); ctx.fillStyle = COR.apoio; var dw = ctx.measureText(" de " + it.de).width; ctx.fillText(" de " + it.de, x + L, yy + h / 2 + 12); ctx.font = f(800, 40); ctx.fillStyle = COR.texto; ctx.fillText(String(it.valor), x + L - dw, yy + h / 2 + 14); }
            else { ctx.font = f(800, it.valorPequeno ? 32 : 40); ctx.fillStyle = COR.texto; ctx.fillText(String(it.valor), x + L, yy + h / 2 + 13); }
            ctx.textAlign = "left";
          });
        }
      };
    },
    pessoa: function (p) { // {nome, partido, iniciais, foto?: HTMLImageElement}
      return {
        altura: function () { return 110; },
        desenhar: function (ctx, x, y) {
          var d = 110;
          ctx.save(); ctx.beginPath(); ctx.arc(x + d / 2, y + d / 2, d / 2, 0, 7); ctx.clip();
          if (p.foto) ctx.drawImage(p.foto, x, y, d, d);
          else { ctx.fillStyle = "#E1F0E6"; ctx.fillRect(x, y, d, d); ctx.fillStyle = COR.marca; ctx.font = f(800, 40); ctx.textAlign = "center"; ctx.fillText(p.iniciais || "", x + d / 2, y + d / 2 + 14); ctx.textAlign = "left"; }
          ctx.restore();
          ctx.fillStyle = COR.texto; ctx.font = f(800, 44); ctx.fillText(p.nome, x + d + 26, y + 52);
          ctx.fillStyle = COR.apoio; ctx.font = f(600, 28); ctx.fillText(p.partido || "", x + d + 26, y + 92);
        }
      };
    },
    divisor: function () {
      return { altura: function () { return 2; }, desenhar: function (ctx, x, y, L) { ctx.fillStyle = COR.linha; ctx.fillRect(x, y, L, 2); } };
    }
  };

  function opcional(b, grupo) { b.opcional = grupo || true; return b; }

  /* ---------- montagem por tipo de cartão ---------- */
  function blocosSessao(d, fmt) {
    var numeros = (d.numeros || []).filter(function (n) { return n && n.valor > 0; });
    var materias = d.materias || [];
    var bl = numeros.length ? [B.nums(numeros)] : [], max = fmt === "story" ? 4 : 2;
    materias.slice(0, max).forEach(function (m, i) {
      var g = i >= 1 ? "m" + i : null; // a 1ª matéria sempre aparece; as demais saem se faltar espaço
      var tags = [];
      if (m.resultado) tags.push(resultadoTag(m.resultado));
      if (m.tema) tags.push({ texto: m.tema, corQuadrado: m.corTema });
      var parte = [];
      if (bl.length) parte.push(B.divisor());
      if (tags.length) parte.push(B.tags(tags));
      parte.push(B.texto(m.titulo, { tam: fmt === "story" ? 40 : 38, peso: 800, lh: 1.2, maxLinhas: 2 }));
      if (fmt === "story" && m.sigla) parte.push(B.texto(m.sigla, { tam: 28, peso: 600, cor: COR.apoio }));
      parte.forEach(function (b) { if (g) opcional(b, g); b.materia = i; bl.push(b); });
    });
    if (!bl.length) bl.push(B.texto("Nenhum projeto de lei votado neste período.", { tam: 30, cor: COR.apoio }));
    var mais = { texto: "", altura: function (ctx, L) { return this.texto ? 30 : 0; },
      desenhar: function (ctx, x, y) { if (!this.texto) return; ctx.font = f(600, 28); ctx.fillStyle = COR.apoio; ctx.fillText(this.texto, x, y + 26); } };
    mais.contarMaterias = materias.length; bl.push(mais);
    return bl;
  }
  function resultadoTag(r) {
    var rej = /rejeit/i.test(r), apr = /aprovad/i.test(r);
    if (!rej && !apr) return { texto: r, marcador: "tracejado", corMarcador: COR.apoio };
    return { texto: r, fundo: rej ? COR.nao : COR.sim, cor: COR.branco, marcador: rej ? "anel" : "cheio", corMarcador: COR.branco };
  }
  function blocosMateria(d, fmt) {
    var tags = [];
    if (d.resultado) tags.push(resultadoTag(d.resultado));
    if (d.tema) tags.push({ texto: d.tema, corQuadrado: d.corTema });
    if (d.turno) tags.push({ texto: d.turno });
    var bl = [];
    if (tags.length) bl.push(B.tags(tags));

  function contagemPresencaSessao(sessao) {
    if (!sessao) {
      return { presentes: 0, faltas: 0, fora: 0, licenca: 0, banca: 0 };
    }
    var presentes = sessao.n_presentes != null ? sessao.n_presentes : 0;
    var faltas =
      (sessao.n_faltas_com_justificativa || 0) + (sessao.n_faltas_sem_justificativa || 0);
    var fora = sessao.n_fora_do_mandato || 0;
    var licenca = sessao.n_licenca || 0;
    return {
      presentes: presentes,
      faltas: faltas,
      fora: fora,
      licenca: licenca,
      banca: presentes + faltas + licenca
    };
  }

  function vereadoresNoMandatoNaSessao(sessao) {
    var c = contagemPresencaSessao(sessao);
    return c.banca > 0 ? c.banca : c.presentes;

  function contagemResultadosMaterias(lista) {
    var out = { unanimidade: 0, maioria: 0, rejeitado: 0, outro: 0 };
    (lista || []).forEach(function (m) {
      var r = m.resultado || "outro";
      if (r === "unanimidade") out.unanimidade += 1;
      else if (r === "maioria") out.maioria += 1;
      else if (r === "rejeitado") out.rejeitado += 1;
      else if (
        r === "primeiro_turno" ||
        r === "turno_nao_identificado" ||
        (r.indexOf("nao_deliberativo:") === 0)
      ) return;
      else out.outro += 1;
    });
    return out;
  }

  function totalVereadoresAtivos() {
    var meta = estado.dados && estado.dados.meta;

    return vereadoresOrdenados().filter(function (v) { return !mandatoEncerrado(v); }).length;

  // Frase-resumo do período (textos-compartilhamento.md, seção 5). Devolve HTML com os números em <strong>.
  // longo: { sessoes: n, anos: "de 2025 e 2026" } acrescenta o contexto do período longo antes.
  function fraseResumoNumeros(total, unanimes, maioria, rejeitadas, longo) {
    var N = function (x) { return "<strong>" + x + "</strong>"; };
    var aprovados = unanimes + maioria;
    if (longo && longo.sessoes > 0) {
      var inicio = "Em " + N(longo.sessoes) + " " + formaNum(longo.sessoes, "sessão ordinária", "sessões ordinárias") + " " + longo.anos + ", ";
      if (total === 0) return inicio + "a Câmara não votou projetos de lei.";
      inicio += "a Câmara votou " + N(total) + " " + formaNum(total, "projeto de lei", "projetos de lei") + ". ";
      if (rejeitadas > 0) {
        if (aprovados === 0) {
          return inicio + formaNum(rejeitadas, "Foi", "Foram") + " " + N(rejeitadas) + " " + formaNum(rejeitadas, "rejeitado", "rejeitados") + ".";
        }
        return inicio + formaNum(aprovados, "Foi", "Foram") + " " + N(aprovados) + " " + formaNum(aprovados, "aprovado", "aprovados") +
          " e " + N(rejeitadas) + " " + formaNum(rejeitadas, "rejeitado", "rejeitados") + ".";
      }
      var sujeito = total === 1 ? "Foi aprovado" : (total === 2 ? "Os dois foram aprovados" : "Todos foram aprovados");
      if (maioria === 0 && unanimes === total) return inicio + sujeito + " por unanimidade.";
      if (unanimes === 0 && maioria === total) return inicio + sujeito + " por maioria.";
      return inicio + sujeito + ": " + N(unanimes) + " por unanimidade e " + N(maioria) + " por maioria.";
    }
    if (total === 0) return "A Câmara não votou projetos de lei neste período.";
    if (rejeitadas > 0) {
      var partes = aprovados > 0 ? N(aprovados) + " " + formaNum(aprovados, "aprovado", "aprovados") + " e " : "";
      return "A Câmara votou " + N(total) + " " + formaNum(total, "projeto de lei", "projetos de lei") + ": " +
        partes + N(rejeitadas) + " " + formaNum(rejeitadas, "rejeitado", "rejeitados") + ".";
    }
    if (total === 1) {
      return "A Câmara aprovou o único projeto de lei votado, por " + (maioria === 1 ? "maioria" : "unanimidade") + ".";
    }
    var qual = total === 2 ? "os dois" : "todos";
    if (maioria === 0 && unanimes === total) {
      return "A Câmara aprovou os " + N(total) + " projetos de lei votados, " + qual + " por unanimidade.";
    }
    if (unanimes === 0 && maioria === total) {
      return "A Câmara aprovou os " + N(total) + " projetos de lei votados, " + qual + " por maioria.";
    }
    return "A Câmara aprovou os " + N(total) + " projetos de lei votados: " + N(unanimes) + " por unanimidade e " + N(maioria) + " por maioria.";
  }

  function mapaNomesVotacoesPeriodo(periodo) {
    var mapa = {};
    listaVotacoesPeriodo(periodo).forEach(function (e) {
      var item = e.raw;
      if (item.tipo_sigla && item.tipo_nome && mapa[item.tipo_sigla] == null) {
        mapa[item.tipo_sigla] = item.tipo_nome;
      }
      if (e.kind === "pleg" && item.tipo_descricao && mapa[e.tipo_sigla] == null) {
        mapa[e.tipo_sigla] = item.tipo_descricao;
      }
    });
    return mapa;
  }

  function fraseResumoContagemTipos(periodo, longo) {
    var lista = listaVotacoesPeriodo(periodo);
    var total = lista.length;
    var N = function (x) { return "<strong>" + x + "</strong>"; };
    var prefixo = "";
    if (longo && longo.sessoes > 0) {
      prefixo = "Em " + N(longo.sessoes) + " " + formaNum(longo.sessoes, "sess\u00e3o ordin\u00e1ria", "sess\u00f5es ordin\u00e1rias") + " " + longo.anos + ", ";
    }
    if (total === 0) {
      return prefixo + "N\u00e3o houve itens votados com registro no SAPL neste per\u00edodo.";
    }
    var cont = contagemVotacoesPorTipo(periodo);
    var mapa = mapaNomesVotacoesPeriodo(periodo);
    var partes = [];
    ordemTiposVotacao().forEach(function (sigla) {
      var q = cont[sigla] || 0;
      if (q <= 0) return;
      var rotulo = rotuloTipoVotacaoUi(sigla, q, mapa);
      rotulo = rotulo.charAt(0).toLowerCase() + rotulo.slice(1);
      partes.push(N(q) + " " + htmlBotaoTermoSigla(sigla, rotulo));
    });
    var itemPal = total === 1 ? "item votado" : "itens votados";
    var divisao = partes.length <= 1 ? partes.join("") :
      partes.slice(0, -1).join(", ") + " e " + partes[partes.length - 1];
    return prefixo + "Foram " + N(total) + " " + itemPal + (partes.length ? ": " + divisao : "") + ".";
  }

  /* Rosca por tipo (RI-1i). SVG montado aqui, sem biblioteca. Anel com a espessura da barra
     segmentada, vãos de 3 px entre fatias e pontas retas, como os segmentos da barra.
     As fatias respondem ao toque; teclado e leitor de tela usam a legenda (botões com aria-pressed). */
  function roscaSVGTiposInterativa(partes, total, periodo) {
    var lado = 200;
    var c = lado / 2;
    var raio = 82;
    var espessura = 17;
    var espessuraAtiva = 23;
    var circ = 2 * Math.PI * raio;
    var vao = 3.4;
    var minimo = 5;
    var filtro = estadoMaterias.filtroTipo;
    var ativa = null;
    var inicio = -Math.PI / 2;
    function ponto(ang) {
      return (c + raio * Math.cos(ang)).toFixed(2) + " " + (c + raio * Math.sin(ang)).toFixed(2);
    }
    var arcos = partes.map(function (p) {
      var ehAtiva = filtro === p.sigla;
      if (ehAtiva) ativa = p;
      var attrs = ' class="fatia-tipo-votacao' + (ehAtiva ? " ativo" : "") + '" fill="none" stroke="' + esc(p.cor) +
        '" stroke-width="' + (ehAtiva ? espessuraAtiva : espessura) + '" stroke-linecap="butt"' +
        ' data-periodo="' + esc(periodo) + '" data-tipo-votacao="' + esc(p.sigla) + '"';
      if (partes.length === 1) {
        return '<circle cx="' + c + '" cy="' + c + '" r="' + raio + '"' + attrs + "/>";
      }
      var fatia = total > 0 ? (p.valor / total) * 2 * Math.PI : 0;
      var comp = Math.max(fatia * raio - vao, minimo);
      var meio = inicio + fatia / 2;
      var a0 = meio - comp / raio / 2;
      var a1 = meio + comp / raio / 2;
      inicio += fatia;
      var grande = a1 - a0 > Math.PI ? 1 : 0;
      return '<path d="M ' + ponto(a0) + " A " + raio + " " + raio + " 0 " + grande + " 1 " + ponto(a1) + '"' + attrs + "/>";
    }).join("");
    var resumo = total + " " + (total === 1 ? "item votado" : "itens votados") + ": " +
      partes.map(function (p) { return p.valor + " " + p.rotulo; }).join(", ");
    var numero = ativa ? ativa.valor : total;
    var rotulo = ativa ? ativa.rotulo : (total === 1 ? "item votado" : "itens votados");
    return '<div class="rosca-tipos-figura">' +
      '<svg class="rosca-tipos-votacao' + (ativa ? " com-filtro" : "") + '" viewBox="0 0 ' + lado + " " + lado +
      '" role="img" aria-label="' + esc(resumo) + '" focusable="false">' + arcos + "</svg>" +
      '<div class="rosca-tipos-centro" aria-hidden="true"><b>' + esc(numero) + "</b><span>" + esc(rotulo) + "</span>" +
      (ativa ? "<span>de " + esc(total) + "</span>" : "") + "</div></div>";
  }

  function alternarFiltroTipoViaGrafico(periodo, sigla) {
    var focoNaLegenda = document.activeElement && document.activeElement.classList &&
      document.activeElement.classList.contains("legenda-tipo-votacao");
    estadoMaterias.filtroTipo = estadoMaterias.filtroTipo === sigla ? "" : sigla;

    renderCartaoGraficoTipos(periodo);

      var card = document.getElementById(periodo === "mes" ? "card-grafico-tipos-mes" : "card-grafico-tipos-todo");
      var alvo = card && Array.prototype.find.call(card.querySelectorAll(".legenda-tipo-votacao"), function (b) {
        return b.getAttribute("data-tipo-votacao") === sigla;
      });
      if (alvo) alvo.focus({ preventScroll: true });
    }
    if (estadoMaterias.filtroTipo) {
      var bloco = document.getElementById("bloco-votado-" + periodo);
      if (bloco) bloco.scrollIntoView({ behavior: "smooth", block: "nearest" });
    }
  }

  function ligarInteracaoGraficoTipos(raiz, periodo) {
    if (!raiz) return;
    raiz.querySelectorAll("[data-tipo-votacao][data-periodo]").forEach(function (el) {
      function ativar() {
        alternarFiltroTipoViaGrafico(el.getAttribute("data-periodo"), el.getAttribute("data-tipo-votacao"));
      }
      el.addEventListener("click", ativar);
      el.addEventListener("keydown", function (ev) {
        if (ev.key === "Enter" || ev.key === " ") {
          ev.preventDefault();
          ativar();
        }
      });
    });

  function esc(texto) {
    if (texto == null) return "";
    var s = String(texto)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#39;");
    s = s.replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F\u007F-\u009F]/g, function (c) {
      return "&#" + c.charCodeAt(0) + ";";
    });
    return s;
  }

  function normalizarTexto(texto) {

      .toLowerCase()
      .normalize("NFD")
      .replace(/[\u0300-\u036f]/g, "");
  }

  var LIMITE_MAIUSCULAS_EMENTA = 0.8;
  var LETRA_EMENTA = /[A-Za-zÀ-ÖØ-öø-ÿ]/;

  function ementaTemMaisDe80PorCentoDeMaiusculas(texto) {
    var letras = 0;
    var maiusculas = 0;
    for (var i = 0; i < texto.length; i++) {
      var c = texto.charAt(i);
      if (!LETRA_EMENTA.test(c)) continue;
      letras++;
      if (c === c.toUpperCase() && c !== c.toLowerCase()) maiusculas++;
    }
    if (!letras) return false;
    return maiusculas / letras > LIMITE_MAIUSCULAS_EMENTA;
  }

  function ementaEscaparRegex(texto) {
    return String(texto).replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
  }

  var CACHE_TERMOS_EMENTA = null;

  function ementaListaTermosPreservados() {
    if (CACHE_TERMOS_EMENTA) return CACHE_TERMOS_EMENTA;
    var config = typeof CONFIG_CIDADE !== "undefined" ? CONFIG_CIDADE : null;
    var bloco = (config && config.ementa_termos_preservados) || {};
    var lista = (Array.isArray(bloco.lista) ? bloco.lista.slice() : []).map(function (termo) {
      return String(termo == null ? "" : termo).trim().replace(/\s+/g, " ");
    }).filter(function (grafia) {
      return !!grafia;
    });
    lista.sort(function (a, b) {
      return b.length - a.length;
    });
    CACHE_TERMOS_EMENTA = lista;
    return lista;
  }

  function ementaAplicarTermosPreservados(texto) {
    var saida = String(texto == null ? "" : texto);
    if (!saida) return "";
    var lista = ementaListaTermosPreservados();
    if (!lista.length) return saida;
    var mapa = {};
    lista.forEach(function (grafia) {
      mapa[grafia.toLowerCase()] = grafia;
    });
    var alternativas = lista.map(ementaEscaparRegex).join("|");
    var padrao = new RegExp(
      "(^|[^0-9A-Za-zÀ-ÖØ-öø-ÿ])(" + alternativas + ")(?![0-9A-Za-zÀ-ÖØ-öø-ÿ])",
      "gi"
    );
    return saida.replace(padrao, function (todo, antes, achado) {
      return antes + (mapa[String(achado).toLowerCase()] || achado);
    });
  }

  function ementaPrimeiraLetraDeFrase(texto) {
    var saida = String(texto == null ? "" : texto);
    var i = 0;
    while (i < saida.length && !LETRA_EMENTA.test(saida.charAt(i))) i++;
    if (i < saida.length) {
      saida = saida.slice(0, i) + saida.charAt(i).toUpperCase() + saida.slice(i + 1);
    }
    return saida.replace(/(\.\s+)([a-zà-öø-ÿ])/g, function (todo, antes, letra) {
      return antes + letra.toUpperCase();
    });
  }

  function ementaExibicao(texto) {
    var bruto = String(texto == null ? "" : texto);
    var limpo = bruto.replace(/\s+/g, " ").trim();
    if (!limpo) return "";
    if (!ementaTemMaisDe80PorCentoDeMaiusculas(limpo)) return limpo;
    var saida = limpo.toLowerCase();
    saida = ementaPrimeiraLetraDeFrase(saida);
    saida = ementaAplicarTermosPreservados(saida);
    return saida;
  }

  function ementaBusca(texto) {
    var bruto = String(texto == null ? "" : texto).trim();
    if (!bruto) return "";
    return bruto + " " + ementaExibicao(bruto);
  }

  function urlSegura(url) {
    if (url == null) return "";
    var s = String(url).trim();
    var base = SAPL_ORIGEM || (CONFIG_CIDADE && CONFIG_CIDADE.sapl ? CONFIG_CIDADE.sapl.endereco_base.replace(/\/$/, "") : "");
    var http = base.replace("https://", "http://");
    if (s === http || s.indexOf(http + "/") === 0) {
      return base + s.slice(http.length);
    }
    if (s === base || s.indexOf(base + "/") === 0) return s;
    if (s.charAt(0) === "/" && s.charAt(1) !== "/") return base + s;
    return "";
  }

  function roscaSVG(partes, tamanho, centroPrincipal, centroSub, ariaLabel) {
    var raio = (tamanho - 12) / 2;
    var cx = tamanho / 2;
    var cy = tamanho / 2;
    var circ = 2 * Math.PI * raio;
    var total = partes.reduce(function (s, p) { return s + p.valor; }, 0);
    var centro = "";
    if (centroPrincipal) {
      centro = '<text x="' + cx + '" y="' + (cy - 2) + '" text-anchor="middle" class="rosca-centro">' +
        esc(centroPrincipal) + "</text>";
      if (centroSub) {
        centro += '<text x="' + cx + '" y="' + (cy + 12) + '" text-anchor="middle" class="rosca-centro-sub">' +
          esc(centroSub) + "</text>";
      }
    }
    if (total <= 0) {
      return '<svg width="' + tamanho + '" height="' + tamanho + '" viewBox="0 0 ' + tamanho + ' ' + tamanho + '" role="img" aria-label="' + esc(ariaLabel || "Sem dados") + '">' +
        '<circle cx="' + cx + '" cy="' + cy + '" r="' + raio + '" fill="none" stroke="var(--linha)" stroke-width="12"/>' +
        centro + "</svg>";
    }
    var offset = 0;
    var arcos = partes.filter(function (p) { return p.valor > 0; }).map(function (p) {
      var frac = p.valor / total;
      var dash = frac * circ;
      var gap = circ - dash;
      var arco = '<circle cx="' + cx + '" cy="' + cy + '" r="' + raio + '" fill="none" stroke="' + p.cor + '" stroke-width="12" ' +
        'stroke-dasharray="' + dash.toFixed(2) + " " + gap.toFixed(2) + '" ' +
        'stroke-dashoffset="' + (-offset).toFixed(2) + '" transform="rotate(-90 ' + cx + " " + cy + ')"/>';
      offset += dash;
      return arco;
    }).join("");
    return '<svg width="' + tamanho + '" height="' + tamanho + '" viewBox="0 0 ' + tamanho + ' ' + tamanho + '" role="img" aria-label="' + esc(ariaLabel || "Gráfico em rosca") + '">' +
      '<circle cx="' + cx + '" cy="' + cy + '" r="' + raio + '" fill="none" stroke="var(--linha)" stroke-width="12"/>' +
      arcos + centro + "</svg>";
  }

  function renderSecaoPedidos(v) {

  function htmlPilulaVotoNominal(n) {
    var rot = rotuloVoto(n);
    var est = n.estado;
    var ponto = '<svg width="10" height="10" viewBox="0 0 14 14" aria-hidden="true"><circle cx="7" cy="7" r="5.5" fill="currentColor"/></svg>';
    if (est === "sim") return '<span class="pilula pilula-aprovado">' + ponto + "Votou " + esc(rot) + "</span>";
    if (est === "nao") return '<span class="pilula pilula-rejeitado">' + ponto + "Votou " + esc(rot) + "</span>";
    if (est === "abstencao") return '<span class="pilula" style="background:var(--abstencao);color:var(--sobre-abstencao)">' + esc(rot) + "</span>";
    return '<span class="pilula pilula-sem-deliberacao">' + esc(rot) + "</span>";

  function htmlBarraVotosNominais(vo) {
    var total = vo.total_registros || 0;
    if (!total) return "";
    var defs = [
      { chave: "sim", cor: "var(--sim)" },
      { chave: "nao", cor: "var(--nao)" },
      { chave: "abstencao", cor: "var(--abstencao)" }
    ];
    var aus = (vo.ausente_com_justificativa || 0) + (vo.ausente_sem_justificativa || 0) +
      (vo.nao_votou || 0) + (vo.presidente_que_nao_votou || 0) +
      (vo.presente_sem_voto_individual_registrado || 0) + (vo.fora_do_mandato || 0);
    var html = '<div class="faixa-votos" role="img" aria-label="' + esc(total + " vota\u00e7\u00f5es nominais") + '">';
    defs.forEach(function (d) {
      var n = vo[d.chave] || 0;
      if (n > 0) html += '<i style="width:' + ((n / total) * 100).toFixed(2) + "%;background:" + d.cor + '"></i>';
    });
    if (aus > 0) html += '<i class="seg-listra-suave" style="width:' + ((aus / total) * 100).toFixed(2) + '%"></i>';
    return html + "</div>";
  }

  function quadrosVotosNominais(vo) {
    var rot = (vo && vo.rotulos) || {};
    var numAus = contagemAusenteNominal(vo);
    var defs = [
      ["sim", rot.sim || "Sim", ""],
      ["nao", rot.nao || "N\u00e3o", ""],
      ["abstencao", rot.abstencao || "Absten\u00e7\u00e3o", ""]
    ];
    if (numAus > 0) {
      defs.push(["ausente", rotuloExibicaoAusenteNominal(), " aus"]);
    }
    var idsQuadro = { sim: true, nao: true, abstencao: true, ausente: true };
    var extras = cardsResumoVotos(vo).filter(function (c) {
      return c.num > 0 && !idsQuadro[c.id] &&
        c.id !== "ausente_com_justificativa" && c.id !== "ausente_sem_justificativa";
    });
    var html = defs.map(function (d) {
      var num = d[0] === "ausente" ? numAus : (vo[d[0]] != null ? vo[d[0]] : 0);
      var ativo = estado.filtroClassificacao === d[0];
      var marc = d[0] === "sim" ? "marcador-cor m-sim" :
        d[0] === "nao" ? "marcador-cor m-nao" :
        d[0] === "abstencao" ? "marcador-cor m-abstencao" :
        "marcador-cor seg-listra-suave";
      return '<button type="button" class="qv voto-card' + d[2] + (ativo ? " ativo" : "") + '" data-voto-card="' + esc(d[0]) +
        '" aria-pressed="' + (ativo ? "true" : "false") + '"><b>' + esc(num) +
        '</b><span><span class="' + marc + '"></span>' + esc(d[1]) + "</span></button>";
    }).join("");
    html += extras.map(function (c) {
      var ativo = estado.filtroClassificacao === c.id;
      return '<button type="button" class="qv voto-card aus' + (ativo ? " ativo" : "") + '" data-voto-card="' + esc(c.id) +
        '" aria-pressed="' + (ativo ? "true" : "false") + '"><b>' + esc(c.num) +
        '</b><span>' + htmlMarcadorSeg("seg-listra-suave") + esc(c.rot) + "</span></button>";
    }).join("");
    return '<div class="votos-quadros" role="group" aria-label="Filtrar por tipo de voto">' + html + "</div>";
  }

  function renderSecaoVotos(v) {
    var vo = v.votos;
    var nominais = vo.nominais || [];
    var filtrados = nominais.filter(function (n) {
      if (estado.filtroClassificacao) {
        if (estado.filtroClassificacao === "ausente") {
          if (!estadoNominalEhAusente(n.estado)) return false;
        } else if (n.estado !== estado.filtroClassificacao) return false;
      }
      if (estado.filtroTexto) {
        var busca = normalizarTexto(estado.filtroTexto);
        var ementa = ementaVotacao(n);
        var tagsBusca = n.materia_id ? tagsMateria(n.materia_id) : null;
        var tipoNumeroBusca = tipoNumeroDoVoto(n);
        var texto = (ementa || "") + " " + (n.materia_id || "") + " " + n.data_sessao +
          " " + (tipoNumeroBusca || "");
        if (tagsBusca) texto += " " + tagsBusca.tag_tema;
        if (normalizarTexto(texto).indexOf(busca) === -1) return false;
      }
      return true;
    });

    var totalPag = Math.max(1, Math.ceil(filtrados.length / POR_PAGINA));
    if (estado.pagina > totalPag) estado.pagina = totalPag;
    var inicio = (estado.pagina - 1) * POR_PAGINA;
    var fatia = filtrados.slice(inicio, inicio + POR_PAGINA);

    var itens = fatia.map(function (n) {
      var ementaBruta = ementaVotacao(n);
      var ementa = ementaBruta ? ementaExibicao(ementaBruta) : "";
      var assunto = ementa ? esc(ementa.length > 180 ? ementa.slice(0, 177) + "..." : ementa) : "Mat\u00e9ria n\u00e3o identificada no registro";
      var linkSess = estado.linksSessao[n.sessao_id] || (SAPL_ORIGEM + "/sessao/" + n.sessao_id);
      var turnoHtml = (n.turno === "1o turno" || n.turno === "2o turno")
        ? '<button type="button" class="chip tag-turno tag-explicavel" data-tag="turno" data-valor="' + esc(n.turno) + '" aria-expanded="false" aria-controls="' + TAG_CAIXA_ID + '">' + esc(textoTurnoExibicao(n.turno)) + "</button>"
        : "";
      var pilula = htmlPilulaVotoNominal(n);
      var tagsHtml = htmlTagsMateria(n.materia_id, "", turnoHtml, pilula);
      var tipoNumero = tipoNumeroDoVoto(n);
      return "<li class=\"materia\">" + tagsHtml +
        '<p class="materia-assunto">' + assunto + "</p>" +
        '<div class="linha-meta">' +
        (tipoNumero ? '<span class="sigla">' + esc(tipoNumero) + "</span>" : "") +
        '<span>' + esc(formatarData(n.data_sessao)) + ", sess\u00e3o " + esc(n.sessao_id) + "</span></div>" +
        (n.materia_id ? htmlLinkSapMateria(n.materia_id, "Ver no SAPL") : linkExt(linkSess, "Ver no SAPL")) +
        "</li>";
    }).join("");

    var listaAtiva = listaVotosAtiva();
    var htmlListaVotos = "";
    if (!listaAtiva) {
      htmlListaVotos = '<div class="vazio" id="votos-estado-vazio"><b>Lista de vota\u00e7\u00f5es nominais.</b><span>Toque em um quadro acima ou busque por assunto para ver os registros.</span></div>';
    } else {
      htmlListaVotos =
        '<ul class="lista-votos materias" aria-live="polite">' +
        (itens || '<li class="vazio">Nenhum registro neste filtro.</li>') + "</ul>" +
        '<div class="paginacao">' +
        '<button type="button" id="btn-anterior"' + (estado.pagina <= 1 ? " disabled" : "") + ">Anterior</button>" +
        "<span>P\u00e1gina " + estado.pagina + " de " + totalPag +
        " (" + filtrados.length + " registros)</span>" +
        '<button type="button" id="btn-proximo"' + (estado.pagina >= totalPag ? " disabled" : "") + ">Pr\u00f3xima</button>" +
        "</div>" +
        '<button type="button" class="btn btn-secundario" id="btn-limpar-votos" style="margin-top:12px;width:100%">Limpar filtros</button>';
    }

    return '<article class="cartao ac-cartao" aria-labelledby="tit-votos">' +
      '<h2 class="t2" id="tit-votos">Votos Nominais</h2>' +
      '<p class="apoio">Na maior parte das vota\u00e7\u00f5es a C\u00e2mara registra s\u00f3 o resultado. Quando a vota\u00e7\u00e3o \u00e9 ' +
      htmlBotaoTermo("nominal") + ", o voto de cada vereador fica registrado. Foram <strong>" +
      esc(vo.total_registros) + "</strong> " + (vo.total_registros === 1 ? "vota\u00e7\u00e3o assim" : "vota\u00e7\u00f5es assim") + ".</p>" +
      htmlBarraVotosNominais(vo) +
      quadrosVotosNominais(vo) +
      '<label class="busca-materia" for="filtro-texto"><span class="sr">Buscar vota\u00e7\u00f5es</span>' +
      '<input type="search" id="filtro-texto" value="' + esc(estado.filtroTexto) +
      '" placeholder="Buscar por assunto ou n\u00famero"></label>' +
      htmlListaVotos +
      "</article>";
  }

  
  document.addEventListener('toggle', function(e) {
    if (e.target.tagName === 'DETAILS') {
      var summary = e.target.querySelector('summary');
      if (summary) {
        var key = summary.textContent.trim();
        estado.sanfonasAbertas[key] = e.target.open;
      }
    }
  }, true);

  function restaurarSanfonas() {
    document.querySelectorAll("details").forEach(function(det) {
      var summary = det.querySelector("summary");
      if (summary) {
        var key = summary.textContent.trim();
        if (estado.sanfonasAbertas.hasOwnProperty(key)) {
          if (estado.sanfonasAbertas[key]) {
            det.setAttribute("open", "");
          } else {
            det.removeAttribute("open");
          }
          summary.setAttribute("aria-expanded", estado.sanfonasAbertas[key] ? "true" : "false");
        }
      }
    });
  }

  function fimDoRecorte() {
    if (!ANOS_RECORTE || !ANOS_RECORTE.length) return "";
    return String(Math.max.apply(null, ANOS_RECORTE)) + "-12-31";
  }

  function mandatoEncerrado(v) {
    if (!v) return false;
    if (v.motivos_fora_do_mandato && v.motivos_fora_do_mandato.length) return true;
    var fim = v.data_fim_mandato || "";
    var limite = fimDoRecorte();
    return !!fim && !!limite && fim < limite;
  }

  function vereadoresOrdenados() {
    var lista = (estado.dados && estado.dados.vereadores) || [];
    var ativos = [];
    var encerrados = [];
    lista.forEach(function (ver) {
      if (mandatoEncerrado(ver)) encerrados.push(ver);
      else ativos.push(ver);
    });
    function porNome(a, b) {
      return String(a.nome_parlamentar || "").localeCompare(
        String(b.nome_parlamentar || ""), "pt-BR"
      );
    }
    ativos.sort(porNome);
    encerrados.sort(porNome);
    return ativos.concat(encerrados);
  }

  function renderApp() {
    var v = vereadorAtual();
    if (!v || !estado.dados) return;
    fecharCaixaTag(false);

      estado.sanfonasAbertas = {};
      estado.ultimoVereadorRenderizado = estado.vereadorId;

      '<div class="sel-vereador-wrap">' +

      '<label class="sr" for="sel-vereador">Escolha o vereador</label>' +

      (idxAtual >= listaVereadores.length - 1 ? " disabled" : "") + '><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg></button>' +

    atualizarRodapesColeta();

      captureEvento("vereador_trocado", { vereador: verTroca ? verTroca.nome_parlamentar : "" });

    function irVereador(delta) {
      var lista = vereadoresOrdenados();
      var idx = lista.findIndex(function (ver) {
        return String(ver.id_sapl) === String(estado.vereadorId);

      var novo = idx + delta;
      if (novo >= 0 && novo < lista.length) {
        estado.vereadorId = lista[novo].id_sapl;
        estado.pagina = 1;

  function carregar() {
    aplicarTema(temaInicial());

    fetch(JSON_URL)
      .then(function (r) {
        if (!r.ok) throw new Error("HTTP " + r.status);
        return r.json();
      })
      .then(function (dados) {

        aplicarRotulosMeta(dados);

          "<code>python -m http.server 8080</code> e acesse " +
          "<code>http://localhost:8080/docs/previews-integrado/index.html</code>. " +
          "<code>Erro: " + esc(err.message) + "</code></div>";

var MATERIAS_CAMARA = { sessao: [], mes: [], todo: [] };
  var MATERIAS_TAGS = {};
  var FILTROS_MATERIA = { sessao: [], mes: [], todo: [] };
  var PROPOSICOES_CAMARA = { sessao: [], mes: [], todo: [] };
  var PROPOSICOES_INTEGRA = { sessao: [], mes: [], todo: [] };
  var DATA_MINIMA_VOTACAO_CACHE = "";

  var MATERIAS_URL = prefixoDadosTratados();

  function carregarMateriasCamara() {
    var urls = [
      MATERIAS_URL + "materias_camara_" + SUFIXO_DADOS + ".json",
      MATERIAS_URL + "materias_tags_" + SUFIXO_DADOS + ".json",
      MATERIAS_URL + "filtros_materia_" + SUFIXO_DADOS + ".json"
    ];
    return Promise.all(urls.map(function (url) {
      return fetch(url).then(function (r) {
        if (!r.ok) throw new Error("HTTP " + r.status);
        return r.text().then(function (text) { return JSON.parse(text); });
      });
    })).then(function (results) {
      MATERIAS_CAMARA = results[0];
      MATERIAS_TAGS = results[1];
      FILTROS_MATERIA = results[2];
      DATA_MINIMA_VOTACAO_CACHE = "";
    }).catch(function () {
      MATERIAS_CAMARA = { sessao: [], mes: [], todo: [] };
      MATERIAS_TAGS = {};
      FILTROS_MATERIA = { sessao: [], mes: [], todo: [] };
      
    });
  }

  function tiposPedidos() {
    var tr = CONFIG_CIDADE && CONFIG_CIDADE.tramitacao;
    if (tr && tr.tipos_pedidos && tr.tipos_pedidos.length) return tr.tipos_pedidos.slice();
    return [];
  }

  function nomesPedidosConfig() {
    var tr = CONFIG_CIDADE && CONFIG_CIDADE.tramitacao;
    return (tr && tr.nomes_pedidos) ? tr.nomes_pedidos : {};
  }

  function itemEhTipoPedido(item) {
    if (!item || !item.tipo_sigla) return false;
    return tiposPedidos().indexOf(item.tipo_sigla) >= 0;
  }

  function filtrarListaPedidos(lista) {
    return (lista || []).filter(itemEhTipoPedido);
  }

  function carregarProposicoesCamara() {
    var url = prefixoDadosTratados() + "proposicoes_" + SUFIXO_DADOS + ".json";
    return fetch(url).then(function (r) {
      if (!r.ok) throw new Error("HTTP " + r.status);
      return r.text().then(function (text) { return JSON.parse(text); });
    }).then(function (dados) {
      ["sessao", "mes", "todo"].forEach(function (p) {
        PROPOSICOES_INTEGRA[p] = dados[p] || [];
        PROPOSICOES_CAMARA[p] = filtrarListaPedidos(dados[p]);
      });
      DATA_MINIMA_VOTACAO_CACHE = "";
    }).catch(function () {
      PROPOSICOES_CAMARA = { sessao: [], mes: [], todo: [] };
      PROPOSICOES_INTEGRA = { sessao: [], mes: [], todo: [] };
    });
  }

  function itemTemVotacaoValida(item) {
    return !!(item && item.situacao_final_fonte === "votacao" && item.votacao && item.votacao.data_sessao);
  }

  function datasVotacaoRegistradas() {
    var datas = [];
    function addData(d) {
      if (d && datas.indexOf(d) < 0) datas.push(d);
    }
    ["sessao", "mes", "todo"].forEach(function (p) {
      (MATERIAS_CAMARA[p] || []).forEach(function (m) {
        addData(m.data_sessao);
        ((m.votacoes) || []).forEach(function (v) { addData(v && v.data_sessao); });
      });
    });
    ["sessao", "mes", "todo"].forEach(function (p) {
      (PROPOSICOES_INTEGRA[p] || []).forEach(function (item) {
        if (itemTemVotacaoValida(item)) addData(item.votacao.data_sessao);
      });
    });
    if (EXECUTIVO_DADOS) {
      ["sessao", "mes", "todo"].forEach(function (p) {
        (EXECUTIVO_DADOS[p] || []).forEach(function (item) {
          if (itemTemVotacaoValida(item)) addData(item.votacao.data_sessao);
        });
      });
    }
    return datas.sort();
  }

  function dataMinimaVotacaoRegistrada() {
    if (DATA_MINIMA_VOTACAO_CACHE) return DATA_MINIMA_VOTACAO_CACHE;
    var datas = datasVotacaoRegistradas();
    DATA_MINIMA_VOTACAO_CACHE = datas.length ? datas[0] : "";
    return DATA_MINIMA_VOTACAO_CACHE;
  }

  function fraseApoioCorteVotacaoSapl() {
    var d = dataMinimaVotacaoRegistrada();
    if (!d) return "";
    return "O SAPL registra vota\u00e7\u00f5es a partir de " + formatarData(d) +
      ". Itens anteriores sem registro n\u00e3o aparecem aqui.";
  }

  function fraseApoioPedidosVereadorSapl() {
    var d = dataMinimaVotacaoRegistrada();
    if (!d) return "";
    return "O SAPL registra vota\u00e7\u00f5es a partir de " + formatarData(d) +
      ". Pedidos anteriores n\u00e3o t\u00eam registro de vota\u00e7\u00e3o.";
  }

  function textoExplicacaoSemRegistroVotacao() {
    var d = dataMinimaVotacaoRegistrada();
    if (!d) return "Este pedido \u00e9 anterior e n\u00e3o tem vota\u00e7\u00e3o registrada no SAPL.";
    return "O SAPL registra vota\u00e7\u00f5es a partir de " + formatarData(d) +

  function tiposProposicoesConfig() {
    var tr = CONFIG_CIDADE && CONFIG_CIDADE.tramitacao;
    if (tr && tr.tipos_proposicoes) return tr.tipos_proposicoes.slice();
    return [];
  }

  function tiposExecutivoConfig() {
    var tr = CONFIG_CIDADE && CONFIG_CIDADE.tramitacao;
    if (tr && tr.tipos_executivo) return tr.tipos_executivo.slice();
    return [];
  }

  function mapaNomesTiposLista(lista) {
    var mapa = {};
    (lista || []).forEach(function (item) {
      if (item.tipo_sigla && item.tipo_nome && mapa[item.tipo_sigla] == null) {
        mapa[item.tipo_sigla] = item.tipo_nome;
      }
    });
    return mapa;
  }

  function listaVotacoesPeriodo(periodo) {
    var out = [];
    var idsPleg = {};
    (MATERIAS_CAMARA[periodo] || []).forEach(function (m) {
      idsPleg[m.id] = true;
      var sigPleg = m.tipo_sigla || (tiposProposicoesConfig()[0] || "");
      out.push({ kind: "pleg", raw: m, id: m.id, tipo_sigla: sigPleg, data: m.data_sessao || "" });
    });
    if (EXECUTIVO_DADOS) {
      (EXECUTIVO_DADOS[periodo] || []).forEach(function (item) {
        if (!itemTemVotacaoValida(item)) return;
        var sig = item.tipo_sigla || "";
        if (tiposExecutivoConfig().indexOf(sig) < 0) return;
        out.push({ kind: "exec", raw: item, id: item.id, tipo_sigla: sig, data: item.votacao.data_sessao });
      });
    }
    (PROPOSICOES_INTEGRA[periodo] || []).forEach(function (item) {
      if (!itemTemVotacaoValida(item)) return;
      if (idsPleg[item.id]) return;
      var sig = item.tipo_sigla || "";
      if (tiposPedidos().indexOf(sig) < 0) return;
      out.push({ kind: "prop", raw: item, id: item.id, tipo_sigla: sig, data: item.votacao.data_sessao });
    });
    out.sort(function (a, b) {
      if (a.data !== b.data) return a.data < b.data ? 1 : -1;
      return (parseInt(b.id, 10) || 0) - (parseInt(a.id, 10) || 0);
    });
    return out;
  }

  function contagemVotacoesPorTipo(periodo) {
    var lista = listaVotacoesPeriodo(periodo);
    var out = {};
    lista.forEach(function (e) {
      var t = e.tipo_sigla || "";
      out[t] = (out[t] || 0) + 1;
    });
    return out;
  }

  function ordemTiposVotacao() {
    var tr = CONFIG_CIDADE && CONFIG_CIDADE.tramitacao;
    if (!tr) return [];
    var ordem = (tr.tipos_proposicoes || []).slice();
    (tr.tipos_executivo || []).forEach(function (s) { if (ordem.indexOf(s) < 0) ordem.push(s); });
    (tr.tipos_pedidos || []).forEach(function (s) { if (ordem.indexOf(s) < 0) ordem.push(s); });
    return ordem;
  }

  function tituloCartaoVotacoesPeriodo(periodo) {
    if (periodo === "sessao") return "Vota\u00e7\u00f5es da sess\u00e3o";
    if (periodo === "mes") return "Vota\u00e7\u00f5es do m\u00eas";
    return "Vota\u00e7\u00f5es da legislatura";
  }

  function ordenarPedidosRecentes(a, b) {
    var ya = parseInt(a.ano, 10) || 0;
    var yb = parseInt(b.ano, 10) || 0;
    if (yb !== ya) return yb - ya;
    return (parseInt(b.numero, 10) || 0) - (parseInt(a.numero, 10) || 0);
  }

  function pedidosDoVereador(v) {
    if (!v) return [];
    var id = v.id_sapl;
    return (PROPOSICOES_CAMARA.todo || []).filter(function (item) {
      return (item.autores || []).some(function (a) {
        return String(a.parlamentar_id_sapl) === String(id);
      });
    }).sort(ordenarPedidosRecentes);
  }

  function mapaNomesTipoPedido(lista) {
    var mapa = {};
    (lista || []).forEach(function (item) {
      if (item.tipo_sigla && item.tipo_nome && mapa[item.tipo_sigla] == null) {
        mapa[item.tipo_sigla] = item.tipo_nome;
      }
    });
    return mapa;
  }

  function rotuloTipoPedidoExibicao(sigla, quantidade, mapaNomes) {
    var cfg = nomesPedidosConfig()[sigla];
    if (cfg && (cfg.singular || cfg.plural)) {
      var forma = quantidade === 1 ? (cfg.singular || cfg.plural) : (cfg.plural || cfg.singular);
      forma = String(forma).trim();
      if (forma) return forma.charAt(0).toLowerCase() + forma.slice(1);
    }
    var nome = (mapaNomes && mapaNomes[sigla]) || sigla;
    var base = String(nome).trim();
    return base.charAt(0).toLowerCase() + base.slice(1);
  }

  function rotuloTipoPedidoUi(sigla, quantidade, mapaNomes) {
    var cfg = nomesPedidosConfig()[sigla];
    if (cfg) {
      var rot = quantidade === 1 ? (cfg.rotulo_singular || cfg.singular) : (cfg.rotulo_plural || cfg.plural);
      rot = String(rot || "").trim();
      if (rot) return rot;
    }
    var nome = (mapaNomes && mapaNomes[sigla]) || sigla;
    var base = String(nome).trim();
    if (!base) return sigla;
    return base.charAt(0).toUpperCase() + base.slice(1);
  }

  function nomesTiposVotacaoConfig() {
    var tr = CONFIG_CIDADE && CONFIG_CIDADE.tramitacao;
    return (tr && tr.nomes_tipos_votacao) ? tr.nomes_tipos_votacao : {};
  }

  function rotuloTipoVotacaoUi(sigla, quantidade, mapaNomes) {
    var cfg = nomesTiposVotacaoConfig()[sigla];
    if (cfg) {
      var rot = quantidade === 1 ? (cfg.rotulo_singular || cfg.rotulo_plural) : (cfg.rotulo_plural || cfg.rotulo_singular);
      rot = String(rot || "").trim();
      if (rot) return rot;
    }
    if (sigla && tiposPedidos().indexOf(sigla) >= 0) {
      return rotuloTipoPedidoUi(sigla, quantidade, mapaNomes);
    }
    var nome = (mapaNomes && mapaNomes[sigla]) || descricaoTipoSigla(sigla) || sigla;
    nome = String(nome).trim();
    if (!nome) return sigla;
    return nome.charAt(0).toUpperCase() + nome.slice(1);
  }

  function contagemPedidosPorTipo(lista) {
    var tipos = tiposPedidos();
    var out = {};
    tipos.forEach(function (t) { out[t] = 0; });
    (lista || []).forEach(function (item) {
      if (out[item.tipo_sigla] != null) out[item.tipo_sigla] += 1;
    });
    return out;
  }

  function htmlFraseResumoPedidos(lista, prefixoVerbo) {
    var total = (lista || []).length;
    var verbo = prefixoVerbo || "Foram";
    if (total === 0) return "";
    var mapa = mapaNomesTipoPedido(lista);
    var cont = contagemPedidosPorTipo(lista);
    var tipos = tiposPedidos();
    var partes = [];
    tipos.forEach(function (sigla) {
      var q = cont[sigla] || 0;
      if (q <= 0) return;
      var rotulo = rotuloTipoPedidoExibicao(sigla, q, mapa);
      partes.push("<strong>" + esc(q) + "</strong> " + htmlBotaoTermoSigla(sigla, rotulo));
    });
    var pedPal = total === 1 ? "pedido" : "pedidos";
    var divisao = partes.length <= 1 ? partes.join("") :
      partes.slice(0, -1).join(", ") + " e " + partes[partes.length - 1];
    return verbo + " <strong>" + esc(total) + "</strong> " + pedPal +
      (partes.length ? ": " + divisao : "") + ".";
  }

  function pedidoFoiAprovado(item) {
    if (!item || item.situacao_final_fonte !== "votacao") return false;
    var s = (item.situacao_final || "").toLowerCase();
    return s.indexOf("aprovad") >= 0 && s.indexOf("rejeitad") < 0;
  }

  function htmlPilulaSituacaoPedido(item) {
    if (!item) return "";
    if (item.situacao_final_fonte === "sem_registro") {
      return '<button type="button" class="pilula pilula-sem-deliberacao tag-explicavel" data-tag="sem_registro_votacao" data-valor="Sem registro de vota\u00e7\u00e3o" aria-expanded="false" aria-controls="' + TAG_CAIXA_ID + '">Sem registro de vota\u00e7\u00e3o</button>';
    }
    if (pedidoFoiAprovado(item)) {
      return '<span class="pilula pilula-aprovado">Aprovado</span>';
    }
    var sit = item.situacao_final || "";
    if (/rejeitad/i.test(sit)) {
      return '<span class="pilula pilula-rejeitado">' + esc(sit) + "</span>";
    }
    if (/tramita/i.test(sit) || item.em_tramitacao) {
      var rot = sit || "Em tramitação";
      return '<span class="pilula pilula-tramitacao">' + esc(rot.replace(/tramitacao/i, "tramitação")) + "</span>";
    }
    if (sit) return '<span class="pilula pilula-sem-deliberacao">' + esc(sit) + "</span>";
    return "";
  }

  function nomeAutorPedido(autor) {
    if (!autor) return "";
    return autor.nome_parlamentar || autor.nome_no_sapl || autor.nome || "";
  }

  function juntarNomesLista(nomes) {
    if (!nomes.length) return "";
    if (nomes.length === 1) return nomes[0];
    if (nomes.length === 2) return nomes[0] + " e " + nomes[1];
    return nomes.slice(0, -1).join(", ") + " e " + nomes[nomes.length - 1];
  }

  function htmlAutoriaPedido(item, idVereador) {
    var autores = item.autores || [];
    if (!autores.length) return "";
    if (autores.length === 1 && String(autores[0].parlamentar_id_sapl) === String(idVereador)) {
      return "";
    }
    var primarios = autores.filter(function (a) { return a.primeiro_autor === true; });
    var demais = autores.filter(function (a) { return a.primeiro_autor !== true; });
    if (!primarios.length) {
      var todos = autores.map(nomeAutorPedido).filter(Boolean);
      if (!todos.length) return "";
      if (todos.length <= 2) return "Autoria: " + esc(juntarNomesLista(todos));
      return "Autoria: " + esc(todos.slice(0, 2).join(", ")) + " e mais " + esc(String(todos.length - 2)) + " vereadores";
    }
    var linhaPrim = primarios.map(function (a) {
      return "<strong>" + esc(nomeAutorPedido(a)) + "</strong>";
    });
    var html = "Autoria: " + juntarNomesLista(linhaPrim);
    var nomesDemais = demais.map(nomeAutorPedido).filter(Boolean);
    if (!nomesDemais.length) return html;
    if (nomesDemais.length <= 2) {
      return html + "<br>com " + esc(juntarNomesLista(nomesDemais));

    var meta = estado.dados && estado.dados.meta;

    var sessoes = estado.dados.sessoes || [];

    var datasSessao = sessoes.map(function(s) { return s.data; }).filter(Boolean).sort();
    var ultimaData = datasSessao[datasSessao.length - 1];
    if (!ultimaData) {
      var tituloVazio = document.querySelector("#painel-periodo-mes .sessao-titulo");
      var metaVazio = document.querySelector("#painel-periodo-mes .sessao-meta");
      if (tituloVazio) tituloVazio.textContent = "";
      if (metaVazio) metaVazio.textContent = "";
      return;
    }

    var partes = ultimaData.split("-");
    var ano = parseInt(partes[0]);
    var mes = parseInt(partes[1]);
    var mesAnterior = mes - 1;
    var anoAnterior = ano;
    if (mesAnterior < 1) { mesAnterior = 12; anoAnterior--; }

    var sessoesMes = sessoes.filter(function(s) {
      if (!s.data) return false;
      var p = s.data.split("-");
      return parseInt(p[0]) === anoAnterior && parseInt(p[1]) === mesAnterior;
    });

    var meses = ["Janeiro", "Fevereiro", "Março", "Abril", "Maio", "Junho", "Julho", "Agosto", "Setembro", "Outubro", "Novembro", "Dezembro"];
    var nomeMes = meses[mesAnterior - 1] + " de " + anoAnterior;

    var titulo = document.querySelector("#painel-periodo-mes .sessao-titulo");
    if (titulo) titulo.textContent = nomeMes;

    var metaEl = document.querySelector("#painel-periodo-mes .sessao-meta");
    if (metaEl) metaEl.textContent = sessoesMes.length + " sessões ordinárias.";

    var btnShare = document.querySelector("#painel-periodo-mes .btn-compartilhar-icone");

        var texto = tipoLinha + " " + ementaBusca(item.ementa || "") + " " + entry.id;

        estadoMaterias.limite[periodo] = (estadoMaterias.limite[periodo] || 10) + 10;
        renderBlocoVotadoPeriodo(periodo);
      });
    }
    var btnLimpar = bloco.querySelector(".btn-limpar-filtros-materia");
    if (btnLimpar) {
      btnLimpar.addEventListener("click", function () {
        estadoMaterias.filtroTema = "";
        estadoMaterias.filtroTipo = "";
        estadoMaterias.busca = "";
        estadoMaterias.limite[periodo] = 10;
        renderTemasDistribuicao(periodo);
        if (periodo === "mes" || periodo === "todo") renderCartaoGraficoTipos(periodo);
        renderBlocoVotadoPeriodo(periodo);
      });
    }
    bloco.querySelectorAll(".filtro-tipo-votacao").forEach(function (btn) {
      btn.addEventListener("click", function () {
        var sig = btn.getAttribute("data-tipo-votacao");
        var p = btn.getAttribute("data-periodo");
        estadoMaterias.filtroTipo = estadoMaterias.filtroTipo === sig ? "" : sig;
        estadoMaterias.limite[p] = 10;
        if (p === "mes" || p === "todo") renderCartaoGraficoTipos(p);
        renderBlocoVotadoPeriodo(p);
      });
    });
  }

  function abrirResumoSheet(materia, periodo) {
    var backdrop = document.getElementById("resumo-sheet-backdrop");
