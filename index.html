  /* ---------- Compartilhar (fase 11) e folha de impressão (fase 12) ---------- */
  var ENDERECO_EXIBIDO = "";

  function linkCompartilharSite() {
    if (!PORTAL_OFICIAL) return "";
    if (estadoUI.secao === "vereadores") return PORTAL_OFICIAL + "#vereadores";
    return PORTAL_OFICIAL + "/";
  }

  // Os cartões têm fundo claro fixo: a cor da categoria vem sempre do tema claro.
  var CORES_CATEGORIA_CLARO = {
    "--cat-administracao": "#5B6B8C", "--cat-ruas": "#B64000", "--cat-iluminacao": "#A87A00",
    "--cat-desenvolvimento": "#578AE6", "--cat-agricultura": "#567000", "--cat-educacao": "#7B4DE0",
    "--cat-cultura": "#B61064", "--cat-homenagens": "#D8603D", "--cat-saude": "#D6334A",
    "--cat-assistencia": "#0096A8", "--cat-meio-ambiente": "#0F9C80", "--cat-seguranca": "#5272DA",
    "--cat-defesa-civil": "#5E2CA5"
  };

  var shareContexto = { tipo: "periodo", periodo: "sessao" };
  var shareGatilhoAnterior = null;
  var shareGeracao = 0;
  var shareBlobs = { feed: null, story: null };
  var shareFormatoRede = "feed";

  function corCategoriaClaro(tema) {
    var v = varCategoria(tema);
    return CORES_CATEGORIA_CLARO[v] || "#7C8C82";
  }

  function hashtagCidade() {
    var semAcento = nomeCidade().normalize("NFD").replace(/[̀-ͯ]/g, "");
    return "#" + semAcento.split(/[^A-Za-z0-9]+/).filter(Boolean).map(function (p) {
      return p.charAt(0).toUpperCase() + p.slice(1);
    }).join("");
  }

  function linhaHashtags() {
    return "#EmPratosLimpos " + hashtagCidade() + " #CamaraMunicipal";
  }

  function linhaFonteLegenda() {
    var data = dataColetaCurta();
    return data ? "Fonte: SAPL da Câmara, dados de " + data + "." : "Fonte: SAPL da Câmara.";
  }

  // Junta só as linhas com conteúdo: nenhuma linha sai com dado ausente.
  function juntarLinhas(linhas) {
    return linhas.filter(function (l) {
      return typeof l === "string" && l.trim() && !/undefined|null|NaN/.test(l);
    }).join("\n");
  }

  function textoSemHtml(html) {
    var div = document.createElement("div");
    div.innerHTML = html;
    return (div.textContent || "").replace(/\s+/g, " ").trim();
  }

  function textoFrasePeriodo(periodo, semPresenca) {
    return textoSemHtml(htmlFraseResumoPeriodo(periodo, semPresenca));
  }

  function plural(n, um, varios) {
    return n + " " + (n === 1 ? um : varios);
  }

  function juntarComE(partes) {
    if (partes.length <= 1) return partes.join("");
    return partes.slice(0, -1).join(", ") + " e " + partes[partes.length - 1];
  }

  function anosDoVereador(v) {
    var anos = (v && v.anos_com_mandato && v.anos_com_mandato.length) ? v.anos_com_mandato : ANOS_RECORTE;
    return juntarComE((anos || []).map(String));
  }

  function fraseVereador(v) {
    var pl = v.projetos_lei || {};
    var n = Number(pl.total_propostos) || 0;
    var anos = anosDoVereador(v);
    var emAnos = anos ? " em " + anos : "";
    if (n === 0) return "Não apresentou projetos de lei" + emAnos + ".";
    var partes = [];
    var a = Number(pl.aprovados) || 0, t = Number(pl.em_tramitacao) || 0, r = Number(pl.rejeitados) || 0;
    if (a > 0) partes.push(plural(a, "aprovado", "aprovados"));
    if (t > 0) partes.push(t + " em tramitação");
    if (r > 0) partes.push(plural(r, "rejeitado", "rejeitados"));
    return "Apresentou " + plural(n, "projeto de lei", "projetos de lei") + emAnos +
      (partes.length ? ": " + juntarComE(partes) : "") + ".";
  }

  function rotuloContextoPeriodo(periodo) {
    if (periodo === "sessao") {
      var d = dataUltimaSessaoFmt();
      return d ? "Última sessão, " + d : "Última sessão";
    }
    if (periodo === "mes") {
      var mes = nomeMesAnteriorUltimaSessao();
      return mes ? "Último mês, " + mes.toLowerCase() : "Último mês";
    }
    return "Tudo, " + rotuloPeriodoLegislatura();
  }

  function rodapeCartaoPeriodo(periodo) {
    if (periodo === "sessao") {
      var d = dataUltimaSessaoFmt();
      return d ? "Última sessão\n" + d : "Última sessão";
    }
    if (periodo === "mes") {
      var mes = nomeMesAnteriorUltimaSessao();
      var m = mes.match(/^(\S+) de (\d{4})$/);
      return m ? "Último mês\n" + m[1].slice(0, 3).toLowerCase() + "/" + m[2] : "Último mês";
    }
    return juntarComE((ANOS_RECORTE || []).map(String));
  }

  function materiasDoContexto(ctx) {
    if (ctx.tipo === "materia" && ctx.dados) return [ctx.dados];
    if (ctx.tipo === "periodo") return MATERIAS_CAMARA[ctx.periodo] || [];
    return [];
  }

  function temaValidoMateria(m) {
    var tags = tagsMateria(m.id);
    return tags && temaValidoParaTag(tags.tag_tema) ? tags.tag_tema : "";
  }

  function numerosPeriodo(periodo) {
    var lista = MATERIAS_CAMARA[periodo] || [];
    var c = contagemResultadosMaterias(lista);
    var C = CartoesEPL.CORES;
    var itens = [];
    if (periodo === "sessao") {
      var aprov = c.unanimidade + c.maioria;
      if (aprov > 0) itens.push({ valor: aprov, rotulo: aprov === 1 ? "Aprovado" : "Aprovados", marcador: "cheio", cor: C.sim });
      if (c.rejeitado > 0) itens.push({ valor: c.rejeitado, rotulo: c.rejeitado === 1 ? "Rejeitado" : "Rejeitados", marcador: "anel", cor: C.nao });
      var s = ultimaSessaoOrdinaria();
      var n = s ? vereadoresNoMandatoNaSessao(s) : 0;
      var p = s && s.n_presentes != null ? s.n_presentes : 0;
      if (n > 0 && p > 0) itens.push({ valor: p, de: n, rotulo: "Vereadores presentes", marcador: "cheio", cor: C.presente });
    } else {
      if (c.unanimidade > 0) itens.push({ valor: c.unanimidade, rotulo: "Unanimidade", marcador: "cheio", cor: C.sim });
      if (c.maioria > 0) itens.push({ valor: c.maioria, rotulo: "Maioria", marcador: "cheio", cor: C.sim });
      if (c.rejeitado > 0) itens.push({ valor: c.rejeitado, rotulo: c.rejeitado === 1 ? "Rejeitado" : "Rejeitados", marcador: "anel", cor: C.nao });
    }
    return itens;
  }

  function materiaParaCartao(m) {
    return {
      tema: temaValidoMateria(m),
      corTema: corCategoriaClaro(temaValidoMateria(m)),
      resultado: rotuloPilulaResultado(m),
      titulo: assuntoMateria(m),
      sigla: m.tipo || ""
    };
  }

  function dadosCartao(ctx) {
    var base = { cidade: nomeCidade(), url: ENDERECO_EXIBIDO };
    if (ctx.tipo === "materia" && ctx.dados) {
      var m = ctx.dados;
      var datas = textoDatasVotacao(m).replace(/^Votada em /, "");
      if (!datas && m.data_sessao) datas = formatarData(m.data_sessao);
      var linhas = [["Resultado", rotuloPilulaResultado(m), "cheio", /rejeit/i.test(rotuloPilulaResultado(m)) ? CartoesEPL.CORES.nao : CartoesEPL.CORES.sim]];
      if (datas) linhas.push(["Votado em", datas]);
      return Object.assign(base, {
        tipo: "materia",
        frase: assuntoMateria(m),
        tema: temaValidoMateria(m),
        corTema: corCategoriaClaro(temaValidoMateria(m)),
        turno: m.turno ? textoTurnoExibicao(m.turno) : "",
        resultado: rotuloPilulaResultado(m),
        ementa: ementaExibicao(m.ementa || ""),
        linhas: linhas,
        chamada: "Para conferir este e os outros projetos votados, acesse:",
        rodape: m.tipo || ""
      });
    }
    if (ctx.tipo === "vereador" && ctx.dados) {
      var v = ctx.dados;
      var pl = v.projetos_lei || {};
      var pr = v.presenca || {};
      var vo = v.votos || {};
      var data = dataColetaCurta();
      return Object.assign(base, {
        tipo: "vereador",
        frase: fraseVereador(v),
        nome: v.nome_parlamentar || v.nome_oficial || "",
        partido: v.partido_sigla || "",
        iniciais: iniciaisNome(v.nome_parlamentar),
        foto: null,
        projetos: { apresentados: Number(pl.total_propostos) || 0, aprovados: Number(pl.aprovados) || 0, tramitacao: Number(pl.em_tramitacao) || 0 },
        presenca: { presente: Number(pr.presencas) || 0, total: Number(pr.sessoes_ordinarias) || 0, justificada: Number(pr.faltas_com_justificativa) || 0, semJustificativa: Number(pr.faltas_sem_justificativa) || 0 },
        votos: { sim: Number(vo.sim) || 0, nao: Number(vo.nao) || 0, abstencao: Number(vo.abstencao) || 0 },
        chamada: "Para conferir todos os projetos e votos do vereador, acesse:",
        rodape: data ? "Sessões até\n" + data : ""
      });
    }
    var periodo = ctx.periodo || "sessao";
    return Object.assign(base, {
      tipo: "sessao",
      frase: textoFrasePeriodo(periodo, true),
      numeros: numerosPeriodo(periodo),
      materias: (MATERIAS_CAMARA[periodo] || []).map(materiaParaCartao),
      chamada: "Para conferir tudo o que a Câmara votou, acesse:",
      rodape: rodapeCartaoPeriodo(periodo)
    });
  }

  function legendaWhatsApp(ctx) {
    if (ctx.tipo === "materia") return "Veja este e os outros projetos votados pela Câmara de " + nomeCidade() + ":\n" + ENDERECO_EXIBIDO;
    if (ctx.tipo === "vereador" && ctx.dados) return "Confira todos os projetos e votos de " + (ctx.dados.nome_parlamentar || "cada vereador") + ":\n" + ENDERECO_EXIBIDO;
    return "Veja tudo o que a Câmara de " + nomeCidade() + " votou:\n" + ENDERECO_EXIBIDO;
  }

  function fraseLegendaPeriodo(periodo) {
    return textoFrasePeriodo(periodo, false)
      .replace(/(^|, )(A|a) Câmara /, function (t, ini, a) { return ini + a + " Câmara de " + nomeCidade() + " "; });
  }

  function legendaInstagram(ctx) {
    var primeira;
    if (ctx.tipo === "materia" && ctx.dados) {
      var m = ctx.dados;
      var datas = textoDatasVotacao(m).replace(/^Votada em /, "");
      if (!datas && m.data_sessao) datas = formatarData(m.data_sessao);
      primeira = assuntoMateria(m) + ": " + rotuloPilulaResultado(m).toLowerCase() + "." +
        (m.tipo ? " " + m.tipo + (datas ? ", votado em " + datas : "") + "." : "");
    } else if (ctx.tipo === "vereador" && ctx.dados) {
      var v = ctx.dados;
      var quem = (v.nome_parlamentar || "") + (v.partido_sigla ? " (" + v.partido_sigla + ")" : "");
      var f = fraseVereador(v);
      primeira = quem + " " + f.charAt(0).toLowerCase() + f.slice(1);
    } else {
      primeira = fraseLegendaPeriodo(ctx.periodo || "sessao");
    }
    return juntarLinhas([primeira, linhaFonteLegenda(), ENDERECO_EXIBIDO, linhaHashtags()]);
  }

  function legendaStories(ctx) {
    var d = dadosCartao(ctx);
    return juntarLinhas([d.frase, ENDERECO_EXIBIDO, linhaHashtags()]);
  }

  function periodoVereadorShare() {
    var dados = estado.dados;
    if (!dados || !dados.sessoes || !dados.sessoes.length) {
      return rotuloPeriodoLegislatura();
    }
    var ultima = dados.sessoes[dados.sessoes.length - 1];
    var data = formatarData(ultima.data);
    if (!data) return rotuloPeriodoLegislatura();
    return rotuloPeriodoLegislatura() + " at\u00e9 " + data;
  }

  function contextoShareAtivo() {
    if (estadoUI.secao === "vereadores") {
      var v = vereadorAtual();
      if (v) return { tipo: "vereador", dados: v };
    }
    return { tipo: "periodo", periodo: estadoMaterias.periodo || "sessao" };
  }

  function textoContextoShare(ctx) {
    if (ctx.tipo === "materia" && ctx.dados) return ctx.dados.tipo || assuntoMateria(ctx.dados);
    if (ctx.tipo === "vereador" && ctx.dados) {
      var data = dataColetaCurta();
      return (ctx.dados.nome_parlamentar || "") + (data ? ", sessões até " + data : "");
    }
    return rotuloContextoPeriodo(ctx.periodo || "sessao");
  }

  function slugTexto(t) {
    return String(t || "").normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase()
      .replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "");
  }

  function slugContextoShare(ctx) {
    if (ctx.tipo === "materia" && ctx.dados) return slugTexto(ctx.dados.tipo || ("materia-" + ctx.dados.id));
    if (ctx.tipo === "vereador" && ctx.dados) return slugTexto(ctx.dados.nome_parlamentar);
    return { sessao: "ultima-sessao", mes: "ultimo-mes", todo: "tudo" }[ctx.periodo] || "camara";
  }

  function carregarFotoVereador(v) {
    var src = v && FOTOS_LOCAIS[String(v.id_sapl)];
    if (!src) return Promise.resolve(null);
    return new Promise(function (ok) {
      var img = new Image();
      img.onload = function () { ok(img); };
      img.onerror = function () { ok(null); };
      img.src = src;
    });
  }

  function dadosCartaoComFoto(ctx) {
    var d = dadosCartao(ctx);
    if (ctx.tipo !== "vereador") return Promise.resolve(d);
    return carregarFotoVereador(ctx.dados).then(function (foto) { d.foto = foto; return d; });
  }

  function mostrarAvisoShare(texto, erro) {
    var feedback = document.getElementById("share-sheet-feedback");
    if (!feedback) return;
    feedback.classList.toggle("erro", !!erro);
    feedback.textContent = texto || "";
  }

  function gerarImagensShare() {
    var geracao = ++shareGeracao;
    var ctx = shareContexto;
    shareBlobs = { feed: null, story: null };
    if (!window.CartoesEPL) return Promise.resolve();
    return dadosCartaoComFoto(ctx).then(function (d) {
      if (geracao !== shareGeracao) return null;
      var balao = document.getElementById("share-canvas-balao");
      var alt = "Cartão: " + d.frase;
      if (balao) balao.setAttribute("aria-label", alt);
      return CartoesEPL.desenhar(d.tipo, "feed", d, balao).then(function (cv) {
        return CartoesEPL.paraBlob(cv);
      }).then(function (blob) {
        if (geracao !== shareGeracao) return null;
        shareBlobs.feed = blob;
        return CartoesEPL.desenhar(d.tipo, "story", d).then(CartoesEPL.paraBlob);
      }).then(function (blob) {
        if (geracao !== shareGeracao || !blob) return;
        shareBlobs.story = blob;
        var rede = document.getElementById("share-rede");
        if (rede && !rede.hidden) desenharVitrine();
      });
    }).catch(function () {
      if (geracao === shareGeracao) mostrarAvisoShare("Não foi possível gerar a imagem neste aparelho.", true);
    });
  }

  function desenharVitrine() {
    var cv = document.getElementById("share-canvas-rede");
    if (!cv || !window.CartoesEPL) return Promise.resolve();
    cv.className = shareFormatoRede;
    return dadosCartaoComFoto(shareContexto).then(function (d) {
      cv.setAttribute("aria-label", "Cartão " + (shareFormatoRede === "story" ? "vertical" : "para o feed") + ": " + d.frase);
      return CartoesEPL.desenhar(d.tipo, shareFormatoRede, d, cv);
    });
  }

  function blobDoFormato(formato) {
    if (shareBlobs[formato]) return Promise.resolve(shareBlobs[formato]);
    return dadosCartaoComFoto(shareContexto).then(function (d) {
      return CartoesEPL.desenhar(d.tipo, formato, d).then(CartoesEPL.paraBlob);
    }).then(function (blob) { shareBlobs[formato] = blob; return blob; });
  }

  function baixarBlob(blob, formato) {
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url;
    a.download = "em-pratos-limpos-" + slugContextoShare(shareContexto) + "-" + formato + ".png";

  function enviarWhatsApp() {
    var legenda = legendaWhatsApp(shareContexto);
    function semMenu(blob) {
      if (blob) baixarBlob(blob, "feed");
      abrirUrlHttps(WHATSAPP_COMPARTILHAR + encodeURIComponent(legenda));
      mostrarAvisoShare(blob ? "Imagem salva. Anexe a imagem na conversa do WhatsApp." : "");
    }
    var blob = shareBlobs.feed;
    if (!blob) {
      blobDoFormato("feed").then(semMenu, function () { semMenu(null); });
      return;
    }
    var arquivo = new File([blob], "em-pratos-limpos.png", { type: "image/png" });
    if (navigator.canShare && navigator.canShare({ files: [arquivo] }) && navigator.share) {
      navigator.share({ files: [arquivo], text: legenda }).catch(function (e) {
        if (e && e.name === "AbortError") return;
        semMenu(blob);
      });
      return;
    }
    semMenu(blob);
  }

  function alternarRede(btn) {
    var rede = document.getElementById("share-rede");
    if (!rede) return;
    var aberta = btn.getAttribute("aria-expanded") === "true";
    document.querySelectorAll("#share-sheet [data-rede]").forEach(function (b) { b.setAttribute("aria-expanded", "false"); });
    if (aberta) { rede.hidden = true; return; }
    shareFormatoRede = btn.getAttribute("data-rede") === "story" ? "story" : "feed";
    btn.setAttribute("aria-expanded", "true");
    var li = btn.closest("li");
    if (li) li.appendChild(rede);
    rede.hidden = false;
    desenharVitrine().then(function () {
      if (rede.scrollIntoView) rede.scrollIntoView({ block: "nearest" });

  function executarAcaoShare(acao) {
    var ctx = propsContextoAnalytics();
    if (acao === "whatsapp") {
      captureEvento("whatsapp_enviado", Object.assign({ formato: "feed" }, ctx));
      enviarWhatsApp();
      return;
    }
    if (acao === "legenda") {
      var leg = shareFormatoRede === "story" ? legendaStories(shareContexto) : legendaInstagram(shareContexto);
      captureEvento("legenda_copiada", Object.assign({ formato: shareFormatoRede }, ctx));
      copiarTextoShare(leg, "Legenda copiada. É só colar no post.");
      return;
    }
    if (acao === "link") {
      captureEvento("link_copiado", ctx);
      copiarTextoShare(linkCompartilharSite(), "Link copiado.");
      return;
    }
    if (acao === "baixar") {
      var formato = shareFormatoRede;
      captureEvento("imagem_baixada", Object.assign({ formato: formato }, ctx));
      blobDoFormato(formato).then(function (blob) {
        baixarBlob(blob, formato);
        mostrarAvisoShare("Imagem salva.");
      }, function () { mostrarAvisoShare("Não foi possível gerar a imagem neste aparelho.", true); });
      return;
    }
    if (acao === "pdf") {
      captureEvento("pdf_gerado", ctx);
      preencherFolhaImpressao(shareContexto);
      fecharShareSheet();
      window.print();
    }
  }

  function copiarFallback(texto) {
    var ta = document.createElement("textarea");
    ta.value = texto;
    ta.setAttribute("readonly", "readonly");
    ta.style.position = "fixed";
    ta.style.left = "-9999px";
    document.body.appendChild(ta);
    ta.select();
    var ok = false;
    try { ok = document.execCommand("copy"); } catch (e) { ok = false; }
    document.body.removeChild(ta);
    return ok;
  }

  function copiarTextoShare(texto, mensagem) {
    function mostrarOk() { mostrarAvisoShare(mensagem || "Texto copiado."); }
    function mostrarFalha() { mostrarAvisoShare("Não foi possível copiar automaticamente. Tente de novo.", true); }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(texto).then(mostrarOk).catch(function () {
        if (copiarFallback(texto)) mostrarOk();
        else mostrarFalha();
      });
      return;
    }
    if (copiarFallback(texto)) mostrarOk();
    else mostrarFalha();
  }

    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
  }

  function prenderFocoNaFolha(backdrop, e) {
    var focoaveis = Array.prototype.filter.call(backdrop.querySelectorAll("button, a[href]"), function (el) {
      return !el.closest("[hidden]");
    });
    if (!focoaveis.length) return;
    var primeiro = focoaveis[0];
    var ultimo = focoaveis[focoaveis.length - 1];
    if (e.shiftKey && document.activeElement === primeiro) {
      e.preventDefault();
      ultimo.focus();
    } else if (!e.shiftKey && document.activeElement === ultimo) {
      e.preventDefault();
      primeiro.focus();
    }
  }

      if (!folhaShareAberta()) return;

  function renderTemasDistribuicao(periodo) {
    var container = document.getElementById("temas-distribuicao-" + periodo);
    if (!container) return;
    var lista = listaVotacoesPeriodo(periodo);
    var total = lista.length;
    if (total === 0) { container.innerHTML = ""; return; }
    var contagem = {};
    lista.forEach(function (entry) {
      var tema = temaItemVotacao(entry);
      if (!temaValidoParaTag(tema)) return;
      contagem[tema] = (contagem[tema] || 0) + 1;
    });
    var ordenado = Object.keys(contagem).sort(function (a, b) { return contagem[b] - contagem[a]; });
    var max = contagem[ordenado[0]] || 1;
    var htmlBarras = ordenado.map(function (tema) {
      var qtd = contagem[tema];
      var pct = Math.round((qtd / max) * 100);
      var vcat = varCategoria(tema);
      var pressed = estadoMaterias.filtroTema === tema ? ' aria-pressed="true"' : ' aria-pressed="false"';
      return '<li><button type="button" class="tema-btn" data-periodo="' + esc(periodo) + '" data-tema="' + esc(tema) + '"' + pressed + '>' +
        '<span class="nome">' + esc(tema) + '</span><span class="qtd">' + qtd + '</span>' +
        '<span class="trilho"><i style="width:' + pct + '%;background:var(' + vcat + ')"></i></span></button></li>';
    }).join("");
    container.innerHTML =
      '<div class="cab-cartao"><h2 class="t2" id="tit-temas-' + esc(periodo) + '">Do que tratam as vota\u00e7\u00f5es</h2>' +
      '<span class="apoio">toque para filtrar</span></div>' +
      '<ul class="temas-lista" role="group" aria-label="Filtrar por tema">' + htmlBarras + "</ul>";
    container.querySelectorAll(".tema-btn").forEach(function (btn) {
      btn.addEventListener("click", function () {
        var t = btn.getAttribute("data-tema");
        var p = btn.getAttribute("data-periodo");
        estadoMaterias.filtroTema = estadoMaterias.filtroTema === t ? "" : t;
        estadoMaterias.limite[p] = 10;
        renderTemasDistribuicao(p);
        renderBlocoVotadoPeriodo(p);
      });
    });
  }

      return { classe: "pilula-sem-registro-sapl", rotulo: "Sem registro no SAPL", explicavel: true };
    }
    var s = item.situacao_final || "";
    if (s === "Aprovado") return { classe: "pilula-aprovado", rotulo: "Aprovado" };
    if (s === "Rejeitado") return { classe: "pilula-rejeitado", rotulo: "Rejeitado" };
    if (s === "Proposi\u00e7\u00e3o transformada em lei") {
      return { classe: "pilula-aprovado", rotulo: s };
    }
    if (item.em_tramitacao) return { classe: "pilula-tramitacao", rotulo: "Em tramita\u00e7\u00e3o" };
    if (s) return { classe: "pilula-sem-deliberacao", rotulo: s };
    return { classe: "pilula-sem-deliberacao", rotulo: "Sem delibera\u00e7\u00e3o" };

  }

  function metaExecutivoPrefeito() {
    return (EXECUTIVO_DADOS && EXECUTIVO_DADOS.meta) ? EXECUTIVO_DADOS.meta : {};
  }

  function situacaoSemRegistroExecutivo() {
    var meta = metaExecutivoPrefeito();
    return meta.situacao_sem_registro || "";
  }

  function bucketResumoPlex(item) {
    var s = (item.situacao_final || "").trim();
    var fonte = item.situacao_final_fonte || "";
    var semReg = situacaoSemRegistroExecutivo();
    if (fonte === "sem_registro" || (semReg && s === semReg)) return "semRegistro";
    if (s === "Aprovado" || s === "Proposi\u00e7\u00e3o transformada em lei") return "aprovados";
    if (s === "Rejeitado") return "rejeitados";
    if (s === "Proposi\u00e7\u00e3o Substitu\u00edda" || s === "Proposi\u00e7\u00e3o retirada pelo autor") return "retirados";
    if (s === "Aguardando emiss\u00e3o de parecer da comiss\u00e3o" || s.indexOf("Adiada discuss\u00e3o e vota\u00e7\u00e3o") === 0) {
      return "tramitacao";
    }
    return "outros";
  }

  function contagemResumoPrefeito(plex) {
    var c = {
      aprovados: 0,
      rejeitados: 0,
      tramitacao: 0,
      retirados: 0,
      totalRegistrado: 0
    };
    plex.forEach(function (item) {
      if (plexSemRegistroSapl(item)) return;
      var b = bucketResumoPlex(item);
      if (b === "outros" || b === "semRegistro") return;
      c[b] += 1;
    });
    c.totalRegistrado = c.aprovados + c.rejeitados + c.tramitacao + c.retirados;
    return c;
  }

  function htmlNotaPlexSemRegistroSapl(plex) {
    var sem = plex.filter(plexSemRegistroSapl);
    if (!sem.length) return "";
    var painel = CONFIG_CIDADE && CONFIG_CIDADE.painel;
    var tpl = painel && painel.nota_plex_sem_registro_sapl;
    if (!tpl) return "";
    var anos = sem.map(function (item) { return parseInt(item.ano, 10); }).filter(function (a) { return isFinite(a); });
    var ano = anos.length ? Math.min.apply(null, anos) : "";
    if (!ano && CONFIG_CIDADE && CONFIG_CIDADE.sapl && CONFIG_CIDADE.sapl.legislatura_inicio) {
      ano = CONFIG_CIDADE.sapl.legislatura_inicio;
    }
    var qtd = sem.length;
    var texto = String(tpl)
      .replace(/\{quantidade\}/g, String(qtd))
      .replace(/\{ano\}/g, String(ano));
    if (qtd === 1) texto = texto.replace(/\bprojetos\b/g, "projeto");
    return '<p class="apoio nota-cartao">' + esc(texto) + "</p>";
  }

  function htmlBarraResumoPrefeito(c) {
    var total = c.totalRegistrado;
    if (!total) return "";
    var partes = [];
    if (c.aprovados > 0) partes.push({ pct: (c.aprovados / total) * 100, tipo: "aprovado" });
    if (c.rejeitados > 0) partes.push({ pct: (c.rejeitados / total) * 100, tipo: "rejeitado" });
    if (c.tramitacao > 0) partes.push({ pct: (c.tramitacao / total) * 100, tipo: "tramitacao" });
    if (c.retirados > 0) partes.push({ pct: (c.retirados / total) * 100, tipo: "retirados" });
    if (!partes.length) return "";
    var aria = [
      c.aprovados ? c.aprovados + " aprovados" : "",
      c.rejeitados ? c.rejeitados + " rejeitados" : "",
      c.tramitacao ? c.tramitacao + " em tramita\u00e7\u00e3o" : "",
      c.retirados ? c.retirados + " retirados ou substitu\u00eddos" : ""
    ].filter(Boolean).join(", ");
    var html = '<div class="seg-barra" role="img" aria-label="' + esc(aria) + '">';
    partes.forEach(function (p) {
      if (p.tipo === "aprovado") {
        html += '<i class="seg-cheio-sim" style="width:' + p.pct.toFixed(2) + '%"></i>';
      } else if (p.tipo === "rejeitado") {
        html += '<i class="seg-listra-nao" style="width:' + p.pct.toFixed(2) + '%"></i>';
      } else if (p.tipo === "tramitacao") {
        html += '<i class="seg-anel-tram-cor" style="width:' + p.pct.toFixed(2) + '%"></i>';
      } else if (p.tipo === "retirados") {
        html += '<i class="seg-cheio-texto" style="width:' + p.pct.toFixed(2) + '%"></i>';
      }
    });
    return html + "</div>";
  }

  function htmlNumerosResumoPrefeito(c) {
    var linhas = [];
    if (c.aprovados > 0) {
      linhas.push('<li><b class="num">' + c.aprovados + '</b><span>' + htmlMarcadorSeg("seg-cheio-sim") + "Aprovados</span></li>");
    }
    if (c.rejeitados > 0) {
      linhas.push('<li><b class="num">' + c.rejeitados + '</b><span>' + htmlMarcadorSeg("seg-listra-nao") + "Rejeitados</span></li>");
    }
    if (c.tramitacao > 0) {
      linhas.push('<li><b class="num">' + c.tramitacao + '</b><span>' + htmlMarcadorSeg("seg-anel-tram-cor") + "Em tramita\u00e7\u00e3o</span></li>");
    }
    if (c.retirados > 0) {
      linhas.push('<li><b class="num">' + c.retirados + '</b><span>' + htmlMarcadorSeg("seg-cheio-texto") + "Retirados ou substitu\u00eddos</span></li>");
    }
    if (!linhas.length) return "";
    return '<ul class="numeros">' + linhas.join("") + "</ul>";
  }

  function materiaCamaraPorId(id) {
    var alvo = idMateriaNum(id);
    if (alvo == null) return null;
    var lista = MATERIAS_CAMARA.todo || [];
    for (var i = 0; i < lista.length; i++) {
      if (idMateriaNum(lista[i].id) === alvo) return lista[i];
    }
    return null;
  }

  function assuntoSumulaVeto(ementa) {
    var t = String(ementa || "");
    var m = t.match(/S[uú]mula:\s*(.+)/i);
    if (m && m[1]) {
      return ementaExibicao(m[1].replace(/^["'\s]+|["'\s]+$/g, ""));
    }
    return "";
  }

  function assuntoVeto(v) {
    if (v.materia_vetada_id != null) {
      var cam = materiaCamaraPorId(v.materia_vetada_id);
      if (cam && cam.ementa) {
        return assuntoMateria({ ementa: cam.ementa, assunto: cam.assunto });
      }
      var plex = listaPlexExecutivo().find(function (item) {
        return idMateriaNum(item.id) === idMateriaNum(v.materia_vetada_id);
      });
      if (plex) return assuntoMateria(plex);
    }
    var sumula = assuntoSumulaVeto(v.ementa);
    if (sumula) return sumula;
    return assuntoMateria(v);
  }

  function dataOrdenacaoPlex(item) {
    if (item.votacao && item.votacao.data_sessao) return item.votacao.data_sessao;
    var regs = item.votacoes_registradas || [];
    var melhor = "";
    regs.forEach(function (r) {
      if (r.voto_valido && r.data_sessao && (!melhor || r.data_sessao > melhor)) melhor = r.data_sessao;
    });
    return melhor;
  }

  function chaveNumeroAnoPlex(item) {
    var ano = parseInt(item.ano, 10) || 0;
    var num = parseInt(item.numero, 10) || 0;
    return ano * 10000 + num;
  }

  function ordenarPlex(lista) {
    return lista.slice().sort(function (a, b) {
      var da = dataOrdenacaoPlex(a);
      var db = dataOrdenacaoPlex(b);
      if (da && db) return db.localeCompare(da);
      if (da) return -1;
      if (db) return 1;
      return chaveNumeroAnoPlex(b) - chaveNumeroAnoPlex(a);
    });
  }

  function ordenarPlexComSemRegistroNoFim(lista) {
    var comRegistro = [];
    var semRegistro = [];
    lista.forEach(function (item) {
      if (plexSemRegistroSapl(item)) semRegistro.push(item);
      else comRegistro.push(item);
    });
    return ordenarPlex(comRegistro).concat(ordenarPlex(semRegistro));
  }

  function plexTemVotacaoRegistrada(item) {
    if (!item || !item.votacao) return false;
    var rotulo = String(item.votacao_rotulo || "").toLowerCase();
    if (rotulo.indexOf("sem votacao registrada") !== -1) return false;
    return item.votacao.registro_votacao_id != null;
  }

  function htmlMiniPlacarPlex(item) {
    var html = '<span class="mini-placar" aria-hidden="true">';
    var tipo = String(item.votacao_tipo || "").toLowerCase();
    if (tipo === "nominal" && item.votos_nominais && item.votos_nominais.length) {
      var votos = item.votos_nominais.slice().sort(function (a, b) {
        return (a.nome_parlamentar || "").localeCompare(b.nome_parlamentar || "", "pt-BR");
      });
      votos.slice(0, 5).forEach(function (v) {
        var ver = vereadorPorIdSapl(v.parlamentar_id_sapl);
        var cls = v.estado === "sim" ? " s" : "";
        var local = ver && FOTOS_LOCAIS[String(ver.id_sapl)];
        if (local) {
          html += '<span class="mini-avatar foto' + cls + '" style="background-image:url(' + esc(local) + ')"></span>';
        } else {
          html += '<span class="mini-avatar' + cls + '">' + esc(iniciaisNome(v.nome_parlamentar)) + "</span>";
        }
      });
    } else {
      for (var i = 0; i < 5; i++) html += "<i></i>";
    }
    return html + "</span>";
  }

  function plexFiltrados() {
    var lista = ordenarPlexComSemRegistroNoFim(listaPlexExecutivo());
    var filtroTema = estadoPrefeito.filtroTema;
    var busca = normalizarTexto(estadoPrefeito.busca || "").trim();
    return lista.filter(function (item) {
      if (filtroTema && (item.tema || "") !== filtroTema) return false;
      if (busca) {
        var texto = (item.tipo || "") + " " + ementaBusca(item.ementa || "") + " " + item.id + " " + assuntoMateria(item);
        if (normalizarTexto(texto).indexOf(busca) === -1) return false;
      }
      return true;
    });
  }

  function renderTemasPrefeito() {
    var container = document.getElementById("temas-distribuicao-prefeito");
    if (!container) return;
    var lista = listaPlexExecutivo();
    if (!lista.length) { container.innerHTML = ""; return; }
    var contagem = {};
    lista.forEach(function (item) {
      var tema = item.tema || "";
      if (!temaValidoParaTag(tema)) return;
      contagem[tema] = (contagem[tema] || 0) + 1;
    });
    var ordenado = Object.keys(contagem).sort(function (a, b) { return contagem[b] - contagem[a]; });
    if (!ordenado.length) { container.innerHTML = ""; return; }
    var max = contagem[ordenado[0]] || 1;
    var htmlBarras = ordenado.map(function (tema) {
      var qtd = contagem[tema];
      var pct = Math.round((qtd / max) * 100);
      var vcat = varCategoria(tema);
      var pressed = estadoPrefeito.filtroTema === tema ? ' aria-pressed="true"' : ' aria-pressed="false"';
      return '<li><button type="button" class="tema-btn" data-prefeito-tema="' + esc(tema) + '"' + pressed + '>' +
        '<span class="nome">' + esc(tema) + '</span><span class="qtd">' + qtd + '</span>' +
        '<span class="trilho"><i style="width:' + pct + '%;background:var(' + vcat + ')"></i></span></button></li>';
    }).join("");
    container.innerHTML =
      '<div class="cab-cartao"><h2 class="t2" id="tit-temas-prefeito">Do que tratam</h2>' +
      '<span class="apoio">toque para filtrar</span></div>' +
      '<ul class="temas-lista" role="group" aria-label="Filtrar por tema">' + htmlBarras + "</ul>";
  }

  function renderVetosPrefeito() {
    var card = document.getElementById("cartao-vetos-prefeito");
    if (!card) return;
    var vetos = listaVetosExecutivo();
    var htmlLista = "";
    if (!vetos.length) {
      htmlLista = '<div class="vazio"><b>Nenhum veto do Prefeito neste per\u00edodo.</b></div>';
    } else {
      htmlLista = vetos.map(function (v) {
        var tipo = v.veto_tipo === "total" ? "Veto total" : v.veto_tipo === "parcial" ? "Veto parcial" : "Veto";
        var listra = v.veto_tipo === "parcial"
          ? '<i class="listra-veto" style="width:10px;height:10px;border-radius:2px;display:block"></i>'
          : "";
        var pilulaVeto = '<span class="pilula pilula-veto pilula-veto-' + esc(v.veto_tipo || "nao") + '">' + listra + esc(tipo) + "</span>";
        var sit = v.veto_situacao ? '<span class="chip-estado-veto">' + esc(v.veto_situacao) + "</span>" : "";
        var assunto = esc(assuntoVeto(v));
        var dataVeto = v.votacao && v.votacao.data_sessao ? formatarData(v.votacao.data_sessao) : "";
        var meta = '<div class="linha-meta">' + htmlLinhaTipoMateria(v.tipo || "") +
          (dataVeto ? '<span class="materia-datas">' + esc(dataVeto) + "</span>" : "") + "</div>";
        var linkVetado = "";
        if (v.materia_vetada_link && v.materia_vetada_tipo) {
          linkVetado = '<a class="fonte" href="' + esc(urlSegura(v.materia_vetada_link)) + '" target="_blank" rel="noopener noreferrer">' +
            esc("Ver " + v.materia_vetada_tipo + " no SAPL") +
            '<svg class="ic" width="16" height="16" aria-hidden="true"><use href="#ic-ver-na-fonte"/></svg></a>';
        }
        return '<div class="item-veto">' +
          '<div class="linha-meta">' + pilulaVeto + sit + "</div>" +
          '<p class="materia-assunto">' + assunto + "</p>" + meta + linkVetado + "</div>";
      }).join("");
    }
    card.innerHTML =
      '<div class="cab-cartao"><h2 class="t2" id="tit-vetos-prefeito">Vetos</h2></div>' +
      '<p class="apoio">Quando o Prefeito n\u00e3o concorda com um projeto aprovado, ele pode vetar tudo ou s\u00f3 uma parte. A C\u00e2mara vota de novo e pode manter ou derrubar o veto.</p>' +
      htmlLista;
  }

  function vereadorPorIdSapl(id) {
    if (!estado.dados || id == null) return null;
    return (estado.dados.vereadores || []).find(function (v) {
      return String(v.id_sapl) === String(id);
    }) || null;
  }

  function htmlPilulaVotoEstado(estado, rotulo) {
    var cls = "pilula-sem-deliberacao";
    if (estado === "sim") cls = "pilula-aprovado";
    else if (estado === "nao") cls = "pilula-rejeitado";
    return '<span class="pilula ' + cls + '">' + esc(rotulo || "") + "</span>";
  }

  function abrirFolhaVotosPlex(item, btn) {
    var tipo = String(item.votacao_tipo || "").toLowerCase();
    var html = "";
    if (tipo === "simbolica") {
      html = '<p class="apoio">Vota\u00e7\u00e3o simb\u00f3lica: a C\u00e2mara registrou s\u00f3 o resultado.</p>';
    } else if (tipo === "nominal" && item.votos_nominais && item.votos_nominais.length) {
      var votos = item.votos_nominais.slice().sort(function (a, b) {
        return (a.nome_parlamentar || "").localeCompare(b.nome_parlamentar || "", "pt-BR");
      });
      html = votos.map(function (v) {
        var ver = vereadorPorIdSapl(v.parlamentar_id_sapl);
        var foto = ver
          ? renderPerfilFoto(ver).replace("perfil-foto-wrap", "avatar")
          : '<div class="avatar" aria-hidden="true"><span>' + esc(iniciaisNome(v.nome_parlamentar)) + "</span></div>";
        return '<div class="pessoa pessoa-voto">' + foto +
          '<span class="nm">' + esc(v.nome_parlamentar) + "</span>" +
          htmlPilulaVotoEstado(v.estado, v.rotulo || v.voto_texto_sapl) + "</div>";
      }).join("");
    } else {
      html = "<p class=\"apoio\">" + esc(item.votos_nominais_rotulo || item.votacao_tipo || "Sem registro de vota\u00e7\u00e3o nominal no SAPL.") + "</p>";
    }
    if (item.votacao && item.votacao.frase_resultado_sapl) {
      html += "<p class=\"apoio\">" + esc(item.votacao.frase_resultado_sapl) + "</p>";
    }
    abrirFolhaGenerica("Como votou cada vereador", html, btn);
  }

  function plexPorId(id) {

    return listaPlexExecutivo().find(function (item) { return idMateriaNum(item.id) === alvo; }) || null;
  }

  function initEventosPrefeito() {
    if (prefeitoEventosOk) return;
    var painel = document.getElementById("painel-prefeito");
    if (!painel) return;
    prefeitoEventosOk = true;
    painel.addEventListener("click", function (e) {
      var btnTema = e.target.closest(".tema-btn[data-prefeito-tema]");
      if (btnTema) {
        var t = btnTema.getAttribute("data-prefeito-tema");
        estadoPrefeito.filtroTema = estadoPrefeito.filtroTema === t ? "" : t;
        estadoPrefeito.limite = 10;
        renderTemasPrefeito();
        renderListaPrefeito();
        return;
      }
      var btnVotos = e.target.closest(".btn-votos-plex");
      if (btnVotos) {
        var item = plexPorId(btnVotos.getAttribute("data-plex-id"));
        if (item) abrirFolhaVotosPlex(item, btnVotos);
        return;
      }
      if (e.target.closest("#btn-mais-prefeito")) {
        estadoPrefeito.limite = (estadoPrefeito.limite || 10) + 10;
        renderListaPrefeito();
        return;
      }
      if (e.target.closest("#btn-limpar-filtros-prefeito")) {
        estadoPrefeito.filtroTema = "";
        estadoPrefeito.busca = "";
        estadoPrefeito.limite = 10;
        renderTemasPrefeito();
        renderListaPrefeito();
      }
    });
    painel.addEventListener("input", function (e) {
      if (e.target && e.target.id === "busca-prefeito") {
        estadoPrefeito.busca = e.target.value;
        estadoPrefeito.limite = 10;
        renderListaPrefeito();
        var novo = document.getElementById("busca-prefeito");
        if (novo) { novo.focus(); novo.setSelectionRange(novo.value.length, novo.value.length); }
      }
    });
  }

  function renderPainelPrefeito() {
    if (!abaPrefeitoAtiva()) return;
    montarEsqueletoPrefeito();
    initEventosPrefeito();
    renderCartaoResumoPrefeito();
    renderTemasPrefeito();
    renderVetosPrefeito();
    renderListaPrefeito();
    atualizarRodapesColeta();
  }

  function initMateriasCamara() {
    ["sessao", "mes", "todo"].forEach(function (periodo) {
      estadoMaterias.listaVisivel[periodo] = true;
      renderBlocoVotadoPeriodo(periodo);
      renderTemasDistribuicao(periodo);
    });
  }

  function resetMateriasPeriodo(periodo) {
    estadoMaterias.periodo = periodo;
    estadoMaterias.filtroTema = "";
    estadoMaterias.filtroTipo = "";
    estadoMaterias.busca = "";
    estadoMaterias.limite[periodo] = 10;
    estadoMaterias.listaVisivel.sessao = false;
    estadoMaterias.listaVisivel.mes = false;
    estadoMaterias.listaVisivel.todo = false;
    estadoMaterias.listaVisivel[periodo] = true;
    renderTemasDistribuicao(periodo);
    renderBlocoVotadoPeriodo(periodo);
  }

  function initNavegacao() {
    var navBtns = document.querySelectorAll("#nav-principal button");
    var lateralBtns = document.querySelectorAll("#menu-lateral-nav button[data-secao-lateral]");
    var painelCamara = document.getElementById("painel-camara");
    var painelVereadores = document.getElementById("painel-vereadores");
    var painelPrefeito = document.getElementById("painel-prefeito");
    var subCamara = document.getElementById("sub-camara");
    var subVereadores = document.getElementById("sub-vereadores");
    var lateralPeriodos = document.getElementById("menu-lateral-periodos");
    var mobilePeriodos = document.getElementById("seletor-periodo-mobile");

    var topoFixoEl = document.querySelector(".topo-fixo");
    var TOPO_COMPACTO_ENTRA = 64;
    var TOPO_COMPACTO_SAI = 8;
    function atualizarTopoCompacto() {
      if (!topoFixoEl) return;
      var rolagem = window.scrollY || document.documentElement.scrollTop || 0;
      var permitido = window.innerWidth < 900 && estadoUI.secao === "vereadores";
      var compacto = topoFixoEl.classList.contains("compacto");
      if (!permitido) compacto = false;
      else if (compacto) compacto = rolagem > TOPO_COMPACTO_SAI;
      else compacto = rolagem > TOPO_COMPACTO_ENTRA;
      topoFixoEl.classList.toggle("compacto", compacto);
    }
    window.addEventListener("scroll", atualizarTopoCompacto, { passive: true });
    window.addEventListener("resize", atualizarTopoCompacto);
    atualizarTopoCompacto();

    if (lateralPeriodos && mobilePeriodos && !lateralPeriodos.firstChild) {
      var clonePeriodos = mobilePeriodos.cloneNode(true);
      clonePeriodos.id = "seletor-periodo-lateral";
      clonePeriodos.setAttribute("aria-label", "Per\u00edodo de consulta no menu lateral");
      (function renomearIdsLateral(raiz) {
        var comId = raiz.querySelectorAll("[id]");
        var mapa = {};
        comId.forEach(function (el) {
          if (el === raiz) return;
          var antigo = el.id;
          var novo = antigo + "-lateral";
          mapa[antigo] = novo;
          el.id = novo;
        });
        comId.forEach(function (el) {
          ["aria-controls", "aria-labelledby"].forEach(function (attr) {
            var val = el.getAttribute(attr);
            if (!val) return;
            var partes = val.trim().split(/\s+/);
            var novas = partes.map(function (p) {
              return mapa[p] || p;
            });
            el.setAttribute(attr, novas.join(" "));
          });
        });
      })(clonePeriodos);
      lateralPeriodos.appendChild(clonePeriodos);
    }

    atualizarVisibilidadePrefeito();

    function trocarSecao(secao) {
      estadoUI.secao = secao;
      navBtns.forEach(function (btn) {
        var ativo = btn.getAttribute("data-secao") === secao;
        btn.classList.toggle("ativo", ativo);
        btn.setAttribute("aria-current", ativo ? "page" : "false");
      });
      lateralBtns.forEach(function (btn) {
        var ativo = btn.getAttribute("data-secao-lateral") === secao;
        btn.classList.toggle("ativo", ativo);
      });
      if (lateralPeriodos) {
        lateralPeriodos.hidden = secao !== "camara";
      }
      painelCamara.classList.toggle("ativo", secao === "camara");
      painelVereadores.classList.toggle("ativo", secao === "vereadores");
      if (painelPrefeito) {
        painelPrefeito.classList.toggle("ativo", secao === "prefeito");
        painelPrefeito.hidden = secao !== "prefeito";
      }
      subCamara.classList.toggle("ativo", secao === "camara");
      subVereadores.classList.toggle("ativo", secao === "vereadores");
      if (secao === "prefeito") renderPainelPrefeito();
      if (secao === "vereadores") captureEvento("aba_vereadores_aberta", {});
      if (secao === "prefeito") captureEvento("aba_prefeito_aberta", {});
      atualizarRotuloBotaoShare();
      atualizarTopoCompacto();
    }

    navBtns.forEach(function (btn) {
      btn.addEventListener("click", function () {
        trocarSecao(btn.getAttribute("data-secao"));
      });
    });
    lateralBtns.forEach(function (btn) {
      btn.addEventListener("click", function () {
        trocarSecao(btn.getAttribute("data-secao-lateral"));
      });
    });

    var paineisPeriodo = {
      sessao: document.getElementById("painel-periodo-sessao"),
      mes: document.getElementById("painel-periodo-mes"),
      todo: document.getElementById("painel-periodo-todo")
    };
    function tabsPeriodoAtivos() {
      return document.querySelectorAll(".seletor-periodo button[data-periodo]");
    }
    function ativarAbaPeriodo(tab, focar) {
      if (!tab) return;
      var id = tab.getAttribute("data-periodo");
      tabsPeriodoAtivos().forEach(function (t) {
        var ativo = t.getAttribute("data-periodo") === id;
        t.classList.toggle("ativo", ativo);
        t.setAttribute("aria-selected", ativo ? "true" : "false");
        t.setAttribute("tabindex", ativo ? "0" : "-1");
      });
      Object.keys(paineisPeriodo).forEach(function (k) {
        var ativo = k === id;
        paineisPeriodo[k].classList.toggle("ativo", ativo);
        paineisPeriodo[k].hidden = !ativo;
      });
      resetMateriasPeriodo(id);
      atualizarRotuloBotaoShare();
      if (focar && tab.focus) tab.focus();
    }
    tabsPeriodoAtivos().forEach(function (tab) {
      tab.addEventListener("click", function () {
        ativarAbaPeriodo(tab, false);
      });
    });
    [mobilePeriodos, document.getElementById("seletor-periodo-lateral")].forEach(function (tablistPeriodo) {
      if (!tablistPeriodo) return;
      tablistPeriodo.addEventListener("keydown", function (e) {
        if (e.key !== "ArrowLeft" && e.key !== "ArrowRight") return;
        var tabs = Array.prototype.slice.call(tabsPeriodoAtivos()).filter(function (t) {
          return tablistPeriodo.contains(t);
        });
        if (!tabs.length) return;
        var atual = tabs.indexOf(document.activeElement);
        if (atual < 0) {
          atual = tabs.findIndex(function (t) { return t.classList.contains("ativo"); });
        }
        if (atual < 0) atual = 0;
        var proximo = e.key === "ArrowRight"
          ? (atual + 1) % tabs.length
          : (atual - 1 + tabs.length) % tabs.length;
        e.preventDefault();
        ativarAbaPeriodo(tabs[proximo], true);
      });
    });

    document.querySelectorAll(".alternar-tema").forEach(function (btn) {
      btn.addEventListener("click", alternarTema);
    });

    if (window.location.hash === "#vereadores") {
      trocarSecao("vereadores");
    } else {
      atualizarRotuloBotaoShare();
    }
  }

  window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", function (e) {
    if (!localStorage.getItem(STORAGE_TEMA)) {
      aplicarTema(e.matches ? "escuro" : "claro");
    }
  });

  document.addEventListener("error", function (e) {
    if (e.target && e.target.classList && e.target.classList.contains("perfil-foto")) {
      e.target.style.display = "none";
    }
  }, true);

  
  document.addEventListener("toggle", function (e) {
    if (e.target.tagName !== "DETAILS") return;
    var summary = e.target.querySelector("summary");
    if (summary) summary.setAttribute("aria-expanded", e.target.open ? "true" : "false");
  }, true);

  var cliqueApoioOk = false;
  function initCliqueApoioRodape() {
    if (cliqueApoioOk) return;
    cliqueApoioOk = true;
    document.addEventListener("click", function (e) {
      var link = e.target && e.target.closest ? e.target.closest(".link-apoio-projeto") : null;
      if (!link) return;
      captureEvento("apoio_clicado", {});
    });
  }

  carregarConfig().then(function () {
    aplicarTema(temaInicial());
    initPosthog();
    atualizarGoatcounter();
    initCliqueApoioRodape();
    initShareSheet();
    initResumoSheet();
    initFolhaGenerica();
    initNavegacao();
    return carregarMateriasCamara().then(carregarProposicoesCamara).then(initMateriasCamara).then(carregarExecutivoPrefeito);
  }).then(carregar);
})();
</script>

<div id="folha-impressao" aria-hidden="true"></div>
</body>
